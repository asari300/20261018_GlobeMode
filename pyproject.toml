[project]
name = "globe-mode"
version = "0.1.0"
description = "GlobeMode — an open-source Modelica IDE (Python API, notebooks and dashboards)"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [
    { name = "asari300", email = "nk.mwhrskaomr.93@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "marimo>=0.25.1",
    "plotly>=7.1.0",
    "polars>=2.0.0",
]

[project.scripts]
globe-mode = "globe_mode:main"

[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[dependency-groups]
dev = [
    "playwright>=1.64.0",
    "pytest>=8",
]

[tool.maturin]
# Rust の束ね（globe-mode-py）を Python のパッケージ globe_mode の中の _native として入れる（S039）
manifest-path = "src/Rust/mod/globe-mode-py/Cargo.toml"
python-source = "src/Python/mod"
module-name = "globe_mode._native"
features = ["pyo3/abi3-py312"]

[tool.pytest.ini_options]
testpaths = ["src/Python/tests"]
