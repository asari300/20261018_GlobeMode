# `globe`（globe-mode-cli）のリリース用バイナリを作る（S044、計画書の WP-I）。
#
# タグ `v*` の push で、4 つの成果物（linux x86_64 / linux aarch64 / windows x86_64 / macOS arm64）と SHA256SUMS を作り、
# GitHub Releases に付ける。手動実行（workflow_dispatch）は dry-run で、同じ成果物を artifact に残すだけ（Release は作らない）。
# cargo-dist は使わない（依存を増やさない。ターゲットは matrix で足りる）。`--features sundials` は付けない
# （cmake と C コンパイラが要るため。ビルドの既定・wasm・CI と同じ構成）。ci.yml とは別の concurrency グループ。
# Linux の globe は cargo-zigbuild（zig cc）で glibc 2.28 に link する（S090）。
# 各アーカイブには、cargo-about（about.toml・about.hbs）で作ったサードパーティのライセンス表 THIRD-PARTY.md も入れる（S052）。
# 同じ 4 ターゲットで Python の wheel（globe-mode-py、abi3-py312）も `uv build --wheel` で作り、その wheel を入れて pytest を回す（S074）。
# wheel の版はタグの push ではタグ（v を除く）、dry-run では pyproject.toml の version。Linux の wheel は
# maturin の --zig（zig cc で glibc 2.28 を狙う）と --compatibility manylinux_2_28 で manylinux_2_28 の tag を付ける
# （maturin が glibc の記号を検査する。S077・S086）。
# wheel の中の globe_mode/THIRD-PARTY.md は同じ about.toml・about.hbs で globe-mode-py から作る（cli との差は pyo3 の 5 crate）。
# S135: Desktop（Tauri）の .deb・.msi も作って Release に付ける（ADR-0023）。secret TAURI_SIGNING_PRIVATE_KEY があるときだけ
# updater の署名（.sig）を作り、release で latest.json（tauri.conf.json の plugins.updater.endpoints が読む）を足す。無ければ署名なしの bundle だけ。
# S176: macOS（macos-latest＝arm64。署名・公証なし）も足した。globe は zig を使わずランナーの rustup で release ビルド、wheel は maturin の
# 既定の tag（macosx_11_0_arm64）。Desktop は .dmg を作り（--bundles app,dmg。dmg だけだと .app が片付けられる: desktop.yml の S160）、
# 鍵があるときは updater 用の GlobeMode_<版>_aarch64.app.tar.gz と .sig も付けて latest.json に darwin-aarch64 を足す。x86_64 の macOS は作らない。
# 作り方は desktop.yml の build と同じ（smoke はそちら）。タグの push では tauri.conf.json の version をタグに合わせる（updater が版を比べるため）。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  MISE_AUTO_INSTALL: "false"
  # S148: zig は ziglang.org から直接取る（コミュニティのミラーが落ちた: ci.yml の run 41702810070）
  MISE_ZIG_USE_COMMUNITY_MIRRORS: "false"

jobs:
  # 配布物に同梱する THIRD-PARTY.md。4 ターゲットの和集合（about.toml の targets）を 1 回だけ作る
  third-party:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: rust
      - uses: Swatinem/rust-cache@v2
        with:
          key: third-party
      - run: cargo install --locked --features cli --version 0.9.2 cargo-about
      - name: THIRD-PARTY.md を作る（許可外のライセンスがあれば失敗する）
        run: |
          cargo about generate --locked --fail --manifest-path src/Rust/mod/globe-mode-cli/Cargo.toml about.hbs -o THIRD-PARTY.md
          cargo about generate --locked --fail --manifest-path src/Rust/mod/globe-mode-py/Cargo.toml about.hbs -o THIRD-PARTY-wheel.md
      - name: 大きさと crate 数
        run: |
          wc -c THIRD-PARTY.md
          echo "crates: $(grep -E '^- [^ ]+ [0-9]+\.[0-9]+\.[0-9]+' THIRD-PARTY.md | sort -u | wc -l)"
          grep -A12 '^## Overview' THIRD-PARTY.md
      - uses: actions/upload-artifact@v4
        with:
          name: third-party
          path: THIRD-PARTY*.md
          if-no-files-found: error

  build:
    needs: third-party
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            exe: ""
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm   # public リポジトリでは無料のネイティブ arm64 ランナー。クロスコンパイルはしない
            exe: ""
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-2025
            exe: .exe
            archive: zip
          - target: aarch64-apple-darwin
            os: macos-latest   # arm64。署名・公証はしない（Gatekeeper の注意は doc/features.md の Desktop の行）
            exe: ""
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        if: runner.os == 'Linux'
        with:
          install_args: rust uv zig
      # Windows では mise の shim 経由の cargo が失敗したので、ランナーの rustup を直接使う（ci.yml の rust-windows と同じ。macOS も同じ）
      - if: runner.os != 'Linux'
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - if: runner.os == 'Windows'
        run: python -m pip install uv
      # macOS の python3 は brew の管理下で pip install できないので、uv は mise の版（mise.lock に macos-arm64 がある）
      - uses: jdx/mise-action@v5
        if: runner.os == 'macOS'
        with:
          install_args: uv
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          name: third-party
      # Linux は zig を cc/linker にして glibc 2.28 に link する（S090。ランナーの glibc 2.39 のままだと古い Linux で動かない）。
      # aarch64 もネイティブのランナーで同じ（クロスはしない）
      - if: runner.os == 'Linux'
        run: cargo install --locked cargo-zigbuild
      - name: globe を作る
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXE: ${{ matrix.exe }}
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            cargo zigbuild --release --locked -p globe-mode-cli --target "$TARGET.2.28"
            echo "BIN=target/$TARGET/release/globe" >> "$GITHUB_ENV"
          else
            cargo build --release --locked -p globe-mode-cli
            echo "BIN=target/release/globe$EXE" >> "$GITHUB_ENV"
          fi
      - name: 動くか確かめる
        run: |
          "$BIN" --version
          if [ "$RUNNER_OS" = "Linux" ]; then objdump -T "$BIN" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1; fi
        shell: bash
      - name: 成果物にまとめる
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ "$IS_TAG" = "true" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)-dryrun"
          fi
          NAME="globe-${VERSION}-${TARGET}"
          mkdir "$NAME"
          cp "$BIN" LICENSE-MIT LICENSE-APACHE README.md THIRD-PARTY.md "$NAME/"
          if [ "$ARCHIVE" = "zip" ]; then 7z a -tzip "$NAME.zip" "$NAME" >/dev/null; else tar czf "$NAME.tar.gz" "$NAME"; fi
          ls -l "$NAME.$ARCHIVE"
          echo "ASSET=$NAME.$ARCHIVE" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: globe-${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error
      # wheel の名前は maturin が付ける（globe_mode-<version>-cp312-abi3-<platform>.whl）
      - name: wheel を作る
        shell: bash
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          # 先頭の 1 つだけ置く（BSD sed の macOS では 0,/re/ が使えないので perl）
          if [ "$IS_TAG" = "true" ]; then V="${GITHUB_REF_NAME#v}" perl -0pi -e 's/^version = .*$/version = "$ENV{V}"/m' pyproject.toml; fi
          grep -m1 '^version' pyproject.toml
          # PEP 517 の既定は linux_* の tag で PyPI に出せない。ランナーの glibc 2.39 のままだと 2_34 も落ちた（run 41376053596）ので、
          # --zig で古い glibc に link する（S086。Debian 12・RHEL 9 にも入る）
          if [ "$RUNNER_OS" = "Linux" ]; then export MATURIN_PEP517_ARGS="--compatibility manylinux_2_28 --zig"; fi
          cp THIRD-PARTY-wheel.md src/Python/mod/globe_mode/THIRD-PARTY.md
          uv build --wheel --out-dir wheel
          ls -l wheel
          uv run --no-project python -m zipfile -l wheel/*.whl | grep -E 'THIRD-PARTY|_native'
      # --no-project: 作業ツリーの src/Python/mod ではなく、作った wheel の globe_mode を読む。extra widget も wheel から入れる（S097）
      - name: wheel を入れて pytest
        shell: bash
        run: uv run --isolated --no-project --with "globe-mode[widget] @ $(ls wheel/*.whl)" --with pytest pytest -q src/Python/tests
      - uses: actions/upload-artifact@v4
        with:
          name: globe-wheel-${{ matrix.target }}
          path: wheel/*.whl
          if-no-files-found: error

  desktop-ui:
    # desktop.yml の ui と同じ（Desktop の UI に wasm は要らないので vite build だけ）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: node pnpm
      - working-directory: src/Svelte
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vite build
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: src/Svelte/dist
          if-no-files-found: error

  desktop:
    needs: desktop-ui
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux
            exe: ""
            bundle: deb
          - os: windows-2025
            name: windows
            exe: .exe
            bundle: msi
          - os: macos-latest   # arm64。署名・公証なし（S176）
            name: macos
            exe: ""
            bundle: dmg
            bundles: app,dmg   # dmg だけだと .app が片付けられる（desktop.yml の S160）
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      DESKTOP: src/Rust/apps/desktop
      # secrets は if: に書けないので env に写して分岐する（S106 と同じ）。tauri-cli はこの 2 つを読んで .sig を作る
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        if: runner.os == 'Linux'
        with:
          install_args: rust
      - if: runner.os != 'Linux'
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - name: Tauri 2 の依存（Linux）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            ${{ env.DESKTOP }} -> target
          key: release-desktop-${{ matrix.name }}
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: src/Svelte/dist
      - name: sidecar の globe を release で作り、target triple 付きの名前で置く
        run: |
          cargo build --release --locked -p globe-mode-cli
          TRIPLE="$(rustc -vV | sed -n 's/^host: //p')"
          cp "target/release/globe${{ matrix.exe }}" "$DESKTOP/binaries/globe-$TRIPLE${{ matrix.exe }}"
      - run: cargo install tauri-cli --version "^2" --locked
      - name: ${{ matrix.bundle }} を作る（鍵があれば updater の .sig も）
        working-directory: ${{ env.DESKTOP }}
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          VERSION=""
          if [ "$IS_TAG" = "true" ]; then VERSION="\"version\":\"${GITHUB_REF_NAME#v}\","; fi
          SIGN=false
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then SIGN=true; else echo "TAURI_SIGNING_PRIVATE_KEY が無いので署名しない（updater では入れられない bundle）"; fi
          if [ "$SIGN" = true ] && grep -q '"pubkey": ""' tauri.conf.json; then echo "::warning::鍵はあるが tauri.conf.json の pubkey が空。アプリは更新を確かめない"; fi
          cargo tauri build --bundles ${{ matrix.bundles || matrix.bundle }} --config "{${VERSION}\"bundle\":{\"createUpdaterArtifacts\":$SIGN}}"
          ls -l target/release/bundle/${{ matrix.bundle }}/ | tee -a "$GITHUB_STEP_SUMMARY"
          # macOS の updater は .dmg でなく .app.tar.gz（と .sig）を読む。名前に版と arch が無いので .dmg に合わせる（鍵がなければ無い）
          if [ "$RUNNER_OS" = macOS ]; then
            ls -l target/release/bundle/macos/ | tee -a "$GITHUB_STEP_SUMMARY"
            N="$(basename target/release/bundle/dmg/*.dmg .dmg)"
            for e in "" .sig; do
              if [ -e "target/release/bundle/macos/GlobeMode.app.tar.gz$e" ]; then mv "target/release/bundle/macos/GlobeMode.app.tar.gz$e" "target/release/bundle/macos/$N.app.tar.gz$e"; fi
            done
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: globe-desktop-${{ matrix.name }}
          path: |
            ${{ env.DESKTOP }}/target/release/bundle/${{ matrix.bundle }}/*.${{ matrix.bundle }}
            ${{ env.DESKTOP }}/target/release/bundle/${{ matrix.bundle }}/*.${{ matrix.bundle }}.sig
            ${{ env.DESKTOP }}/target/release/bundle/macos/*.app.tar.gz
            ${{ env.DESKTOP }}/target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  release:
    needs: [build, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # Release に付けるため。このジョブだけ
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: globe-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: sha256sum globe-* globe_mode-*.whl GlobeMode_* | tee SHA256SUMS
      # updater の endpoints（tauri.conf.json）が読む。キーは <os>-<arch>-<installer>（tauri-plugin-updater の get_urls）、
      # signature は .sig の中身、url は Release の資産。.sig が無ければ（鍵なし）作らない
      - name: latest.json（署名があるときだけ）
        working-directory: dist
        run: |
          python3 - <<'PY'
          import datetime, glob, json, os
          tag, repo = os.environ["GITHUB_REF_NAME"], os.environ["GITHUB_REPOSITORY"]
          platforms = {}
          for key, ext in {"linux-x86_64-deb": "deb", "windows-x86_64-msi": "msi", "darwin-aarch64": "app.tar.gz"}.items():
              for f in glob.glob(f"GlobeMode_*.{ext}"):
                  if os.path.exists(f + ".sig"):
                      sig = open(f + ".sig").read().strip()
                      platforms[key] = {"signature": sig, "url": f"https://github.com/{repo}/releases/download/{tag}/{f}"}
          if not platforms:
              print("署名（.sig）が無いので latest.json を作らない")
          else:
              now = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
              doc = {"version": tag.removeprefix("v"), "pub_date": now, "platforms": platforms}
              json.dump(doc, open("latest.json", "w"), indent=2)
              print(open("latest.json").read())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: |
            dist/SHA256SUMS
            dist/latest.json
      - name: Release に付ける（タグの push のときだけ）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
