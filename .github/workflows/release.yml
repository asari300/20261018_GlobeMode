# `globe`（globe-mode-cli）のリリース用バイナリを作る（S044、計画書の WP-I）。
#
# タグ `v*` の push で、3 つの成果物（linux x86_64 / linux aarch64 / windows x86_64）と SHA256SUMS を作り、
# GitHub Releases に付ける。手動実行（workflow_dispatch）は dry-run で、同じ成果物を artifact に残すだけ（Release は作らない）。
# cargo-dist は使わない（依存を増やさない。3 つのターゲットは matrix で足りる）。`--features sundials` は付けない
# （cmake と C コンパイラが要るため。ビルドの既定・wasm・CI と同じ構成）。ci.yml とは別の concurrency グループ。
# Linux の globe は cargo-zigbuild（zig cc）で glibc 2.28 に link する（S090）。
# 各アーカイブには、cargo-about（about.toml・about.hbs）で作ったサードパーティのライセンス表 THIRD-PARTY.md も入れる（S052）。
# 同じ 3 ターゲットで Python の wheel（globe-mode-py、abi3-py312）も `uv build --wheel` で作り、その wheel を入れて pytest を回す（S074）。
# wheel の版はタグの push ではタグ（v を除く）、dry-run では pyproject.toml の version。Linux の wheel は
# maturin の --zig（zig cc で glibc 2.28 を狙う）と --compatibility manylinux_2_28 で manylinux_2_28 の tag を付ける
# （maturin が glibc の記号を検査する。S077・S086）。
# wheel の中の globe_mode/THIRD-PARTY.md は同じ about.toml・about.hbs で globe-mode-py から作る（cli との差は pyo3 の 5 crate）。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  MISE_AUTO_INSTALL: "false"

jobs:
  # 配布物に同梱する THIRD-PARTY.md。3 ターゲットの和集合（about.toml の targets）を 1 回だけ作る
  third-party:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: rust
      - uses: Swatinem/rust-cache@v2
        with:
          key: third-party
      - run: cargo install --locked --features cli --version 0.9.2 cargo-about
      - name: THIRD-PARTY.md を作る（許可外のライセンスがあれば失敗する）
        run: |
          cargo about generate --locked --fail --manifest-path src/Rust/mod/globe-mode-cli/Cargo.toml about.hbs -o THIRD-PARTY.md
          cargo about generate --locked --fail --manifest-path src/Rust/mod/globe-mode-py/Cargo.toml about.hbs -o THIRD-PARTY-wheel.md
      - name: 大きさと crate 数
        run: |
          wc -c THIRD-PARTY.md
          echo "crates: $(grep -E '^- [^ ]+ [0-9]+\.[0-9]+\.[0-9]+' THIRD-PARTY.md | sort -u | wc -l)"
          grep -A12 '^## Overview' THIRD-PARTY.md
      - uses: actions/upload-artifact@v4
        with:
          name: third-party
          path: THIRD-PARTY*.md
          if-no-files-found: error

  build:
    needs: third-party
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            exe: ""
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm   # public リポジトリでは無料のネイティブ arm64 ランナー。クロスコンパイルはしない
            exe: ""
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-2025
            exe: .exe
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        if: runner.os == 'Linux'
        with:
          install_args: rust uv zig
      # Windows では mise の shim 経由の cargo が失敗したので、ランナーの rustup を直接使う（ci.yml の rust-windows と同じ）
      - if: runner.os == 'Windows'
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable && python -m pip install uv
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          name: third-party
      # Linux は zig を cc/linker にして glibc 2.28 に link する（S090。ランナーの glibc 2.39 のままだと古い Linux で動かない）。
      # aarch64 もネイティブのランナーで同じ（クロスはしない）
      - if: runner.os == 'Linux'
        run: cargo install --locked cargo-zigbuild
      - name: globe を作る
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXE: ${{ matrix.exe }}
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            cargo zigbuild --release --locked -p globe-mode-cli --target "$TARGET.2.28"
            echo "BIN=target/$TARGET/release/globe" >> "$GITHUB_ENV"
          else
            cargo build --release --locked -p globe-mode-cli
            echo "BIN=target/release/globe$EXE" >> "$GITHUB_ENV"
          fi
      - name: 動くか確かめる
        run: |
          "$BIN" --version
          if [ "$RUNNER_OS" = "Linux" ]; then objdump -T "$BIN" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1; fi
        shell: bash
      - name: 成果物にまとめる
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ "$IS_TAG" = "true" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)-dryrun"
          fi
          NAME="globe-${VERSION}-${TARGET}"
          mkdir "$NAME"
          cp "$BIN" LICENSE-MIT LICENSE-APACHE README.md THIRD-PARTY.md "$NAME/"
          if [ "$ARCHIVE" = "zip" ]; then 7z a -tzip "$NAME.zip" "$NAME" >/dev/null; else tar czf "$NAME.tar.gz" "$NAME"; fi
          ls -l "$NAME.$ARCHIVE"
          echo "ASSET=$NAME.$ARCHIVE" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: globe-${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error
      # wheel の名前は maturin が付ける（globe_mode-<version>-cp312-abi3-<platform>.whl）
      - name: wheel を作る
        shell: bash
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ "$IS_TAG" = "true" ]; then sed -i "0,/^version = /s/^version = .*/version = \"${GITHUB_REF_NAME#v}\"/" pyproject.toml; fi
          grep -m1 '^version' pyproject.toml
          # PEP 517 の既定は linux_* の tag で PyPI に出せない。ランナーの glibc 2.39 のままだと 2_34 も落ちた（run 41376053596）ので、
          # --zig で古い glibc に link する（S086。Debian 12・RHEL 9 にも入る）
          if [ "$RUNNER_OS" = "Linux" ]; then export MATURIN_PEP517_ARGS="--compatibility manylinux_2_28 --zig"; fi
          cp THIRD-PARTY-wheel.md src/Python/mod/globe_mode/THIRD-PARTY.md
          uv build --wheel --out-dir wheel
          ls -l wheel
          uv run --no-project python -m zipfile -l wheel/*.whl | grep -E 'THIRD-PARTY|_native'
      # --no-project: 作業ツリーの src/Python/mod ではなく、作った wheel の globe_mode を読む
      - name: wheel を入れて pytest
        shell: bash
        run: uv run --isolated --no-project --with wheel/*.whl --with pytest pytest -q src/Python/tests
      - uses: actions/upload-artifact@v4
        with:
          name: globe-wheel-${{ matrix.target }}
          path: wheel/*.whl
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # Release に付けるため。このジョブだけ
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: globe-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: sha256sum globe-* globe_mode-*.whl | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
      - name: Release に付ける（タグの push のときだけ）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
