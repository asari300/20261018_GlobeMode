# GlobeMode の CI。ツールの版は mise.toml / mise.lock、依存は Cargo.lock と uv.lock で固定する（ADR-0003）。
#
# 差分だけを検査する（ADR-0006）。最初の plan ジョブが .github/scripts/ci_plan.py で
# 「何を検査するか」を決め、各ジョブはその結果で実行か省略かを決める。
#   - 変更した crate と、それに依存する crate だけを clippy / test にかける
#   - 依存の集合（Cargo.lock / Cargo.toml / deny.toml）を変えていなければ cargo deny を省く
#   - 次のときは全体を検査する: 依存・ツール・CI の定義の変更、40 ファイルを超える変更、
#     コミットメッセージの [full-ci]、毎週の定期実行、手動実行（full）
#   - コンパイル済みの依存は rust-cache で使い回す（Cargo.lock が同じなら再ビルドしない）
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 18 * * 0"   # 毎週月曜 03:00 JST に全体を検査する
  workflow_dispatch:
    inputs:
      full:
        description: 全体を検査する
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # mise の shim が、指定していないツールを実行時に自動で入れないようにする
  # （Windows で cargo の実行中に zig・julia・erlang などを入れ始めた: run 39091325647）
  MISE_AUTO_INSTALL: "false"

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      full: ${{ steps.plan.outputs.full }}
      rust: ${{ steps.plan.outputs.rust }}
      rust_packages: ${{ steps.plan.outputs.rust_packages }}
      wasm: ${{ steps.plan.outputs.wasm }}
      wasm_node: ${{ steps.plan.outputs.wasm_node }}
      deny: ${{ steps.plan.outputs.deny }}
      python: ${{ steps.plan.outputs.python }}
      docs: ${{ steps.plan.outputs.docs }}
      slides: ${{ steps.plan.outputs.slides }}
      msl: ${{ steps.plan.outputs.msl }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 判定ロジックの単体テスト
        run: python3 .github/scripts/test_ci_plan.py
      - id: plan
        name: 何を検査するかを決める
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          FULL_INPUT: ${{ inputs.full }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          ARGS=()
          case "$EVENT" in
            push) ARGS+=(--base "$BEFORE") ;;
            pull_request) ARGS+=(--base "$PR_BASE") ;;
            schedule) ARGS+=(--full --reason "定期実行") ;;
            workflow_dispatch)
              if [ "$FULL_INPUT" = "true" ]; then ARGS+=(--full --reason "手動実行"); else ARGS+=(--base "$HEAD_SHA~1"); fi ;;
          esac
          python3 .github/scripts/ci_plan.py "${ARGS[@]}" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"

  rust-linux:
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    env:
      PKGS: ${{ needs.plan.outputs.rust_packages }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: rust
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy $PKGS --all-targets -- -D warnings
      - run: cargo test $PKGS
      - name: wasm32 でビルドできるか（ブラウザ版の前提）
        if: needs.plan.outputs.wasm == 'true'
        run: cargo check --target wasm32-unknown-unknown -p globe-mode-core -p globe-mode-ir -p globe-mode-frontend -p globe-mode-graph -p globe-mode-db -p globe-mode-analysis -p globe-mode-sim -p globe-mode-exec -p globe-mode-protocol -p globe-mode -p globe-mode-wasm
      - name: サンプルの検査
        run: |
          cargo run -q -p globe-mode-cli -- check src/Modelica/GlobeModeExamples/package.mo -m GlobeModeExamples.RC
          ! cargo run -q -p globe-mode-cli -- check src/Modelica/GlobeModeExamples/package.mo -m GlobeModeExamples.Unbalanced
          cargo run -q -p globe-mode-cli -- check src/Modelica/GlobeModeValidation -m GlobeModeValidation.Connect.BooleanSignals
          cargo run -q -p globe-mode-cli -- graph src/Modelica/GlobeModeValidation -m GlobeModeValidation.Connect.Hierarchical -d 2

  wasm-node:
    # S012: P3 の完了条件「bdf が wasm で（Node 上で）動く」。release の wasm をビルドし、wasm-bindgen（mise で
    # ビルド済みのものを入れる。版は Cargo.toml の `=` と同じ）を通して、Node で Decay を bdf・dopri45・auto で回す。
    # 実行系・sim・db・frontend・wasm の束ね（とその依存）を変えたときだけ（ci_plan.py の wasm_node）
    needs: plan
    if: needs.plan.outputs.wasm_node == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: rust github:wasm-bindgen/wasm-bindgen
      - uses: Swatinem/rust-cache@v2
        with:
          # lto などを環境変数で変えた release の wasm32 の成果物は、rust-linux のキャッシュと分ける
          key: wasm-node
      - run: node --version && wasm-bindgen --version
      - name: release の wasm をビルドし、wasm-bindgen --target nodejs を通す（大きさの最適化は mise.toml の wasm:build）
        env:
          # mise run が、入れていないツール（zig・julia など）を入れ始めないように
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: mise run wasm:build
      - name: Node で Decay を回し、x(1) が exp(-1) に合うかを確かめる
        run: node src/Rust/mod/globe-mode-wasm/node/smoke.mjs
      - name: wasm の大きさ
        run: |
          W=target/wasm-pkg/node/globe_mode_wasm_bg.wasm
          echo "wasm: $(stat -c %s "$W") bytes（gzip $(gzip -9c "$W" | wc -c) bytes）" | tee -a "$GITHUB_STEP_SUMMARY"

  deny:
    needs: plan
    if: needs.plan.outputs.deny == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: rust cargo-deny
      - run: cargo deny check

  rust-windows:
    # Windows は時間（無料枠では 2 倍で数える）がかかるので、全体を検査するときだけ
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      # Windows では mise の shim 経由の cargo が rustc -vV で失敗した（run 39091325647）。
      # ランナーに入っている rustup を直接使う。mise.lock の rust も stable なので版はそろう（ADR-0003）。
      - run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - run: rustc -vV
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  msl:
    # MSL 4.1.0 の例題 20 本で、globe check と Rumoca の CLI を突き合わせる（P1 の完了条件）。
    # 重いので全体を検査するときだけ。MSL と Rumoca の CLI は sha256 を固定して取得し、キャッシュする。
    needs: plan
    if: needs.plan.outputs.msl == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: rust
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v6
        with:
          path: |
            data/msl
            data/rumoca
          key: msl-rumoca-${{ hashFiles('src/Rust/xtask/src/main.rs') }}
      - run: cargo xtask fetch-msl
      - run: cargo xtask fetch-rumoca
      - run: cargo xtask msl-compare --report msl-compare.md
      - name: Medium（Modelica.Media）を使う検証モデル
        run: cargo run -q --release -p globe-mode-cli -- check src/Modelica/GlobeModeValidation -L data/msl -m GlobeModeValidation.Connect.MediumFlow
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: msl-compare
          path: msl-compare.md

  python:
    needs: plan
    if: needs.plan.outputs.python == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: uv
      - run: uv sync --locked
      - run: uv run globe-mode

  docs:
    needs: plan
    if: needs.plan.outputs.docs == 'true' || needs.plan.outputs.slides == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: python3 -I .claude/skills/session-docs/check_docs.py
      - uses: jdx/mise-action@v5
        if: needs.plan.outputs.slides == 'true'
        with:
          install_args: uv
      - if: needs.plan.outputs.slides == 'true'
        run: |
          uv sync --locked
          uv run playwright install --with-deps chromium
          uv run python .claude/skills/session-docs/render_slides.py --out render
      - uses: actions/upload-artifact@v7
        if: always() && needs.plan.outputs.slides == 'true'
        with:
          name: slide-screenshots
          path: render/
