# 第三者の action（jdx/mise-action・Swatinem/rust-cache・android-actions/setup-android・reactivecircus/android-emulator-runner・softprops/action-gh-release）は
# コミットの SHA で固定する（#76。タグは付け替えられ、署名鍵やリリースを扱う step の前に偽の cargo を置かれうる）。更新は SHA を引き直し、末尾の版は目印。
# GlobeMode の Android の APK（S092、ADR-0023 の「Android」）。署名なしの debug APK を作り、artifact `globe-android` に残す。
# S106: 同じ apk ジョブで release の APK（aarch64・x86_64 の ABI ごと）も作り、artifact `globe-android-release` に残す。
# secret ANDROID_KEYSTORE_BASE64・ANDROID_KEYSTORE_PASSWORD・ANDROID_KEY_ALIAS・ANDROID_KEY_PASSWORD があるときだけ署名し、
# 無ければ署名なし（*-release-unsigned.apk）。emulator は debug と release の 2 本で smoke を回す（release は
# smoke 用に x86_64 を debuggable で作り直し、署名なしなら使い捨ての鍵で署名する。Tauri は debuggable のときだけ console を logcat に出し、
# 署名なしの APK は入れられないため）。大きさは Step Summary に並べる。
#
# Android では sidecar を使えないので、Tauri の mobile の入口（src/Rust/apps/desktop/src/lib.rs）は UI を表示するだけで、
# 検査と実行は UI がブラウザと同じ WorkerBackend（wasm）で行う。だから UI のビルドは `pnpm build`（wasm:build の出力を入れる）。
# 手順: ui（wasm:build と vite build）→ apk（JDK 17・Android SDK と NDK・`cargo tauri android build --apk --debug`。
# gen/android がまだ無ければ `cargo tauri android init --ci` で作り、artifact `gen-android` に残す）→ emulator（API 34 の
# x86_64 のエミュレータに APK を入れて起動し、UI が組み込みの Decay を検査・実行して console に出す
# `GM-SMOKE check=ok simulate=ok x1=… msl=ok` の 1 行を logcat で待つ。S100、P6。msl=ok は S103: 同梱の MSL.json を読んで
# ChuaCircuit を検査した）。S147: 同じ行に UI の操作の項目（tree・fmt・graph・cancel・settings・plot・def。ライブラリの木・整形・グラフ・止める・実行の設定・プロットの選択・定義ジャンプ）が付き、全部 ok を合格にする（待ちは 15 分）。MSL は ui で fetch-msl してから pnpm build するので、pack-msl.mjs の MSL.json が dist（APK の assets）に入る。UI は VITE_GM_SMOKE=1 でビルドするので、この APK は起動すると smoke を回す。S159: 同じ行の `isolated=1 cancel_path=flag` も合格の条件（Android の WebView は COOP / COEP を付けても cross-origin isolated にならず、止めるのは Worker の作り直しのまま。ADR-0033 の 7 段目。isolated=1 になったら flag に直す）。desktop.yml と同じ理由で tauri-cli は `cargo install` で入れる。
name: android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/Rust/apps/desktop/**"
      - "src/Svelte/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MISE_AUTO_INSTALL: "false"
  DESKTOP: src/Rust/apps/desktop
  APP_ID: io.github.asari300.globemode

jobs:
  ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
        with:
          install_args: rust github:wasm-bindgen/wasm-bindgen node pnpm
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: android-wasm
      # S103: data/msl があれば pnpm build（pack-msl.mjs）が MSL.json を dist に入れる（ADR-0023 の S103。Android で MSL を読める）
      - run: cargo xtask fetch-msl
      - name: release の wasm（mise.toml の wasm:build）と UI（pnpm build。MSL.json も作る）
        env:
          VITE_GM_SMOKE: "1" # S100: 起動したら Decay を検査・実行し、MSL を読んで ChuaCircuit を検査して GM-SMOKE の行を console に出す（emulator が待つ）
        run: |
          mise run wasm:build
          cd src/Svelte
          pnpm install --frozen-lockfile
          pnpm build
          test -s dist/msl/MSL.json
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist-wasm
          path: src/Svelte/dist
          if-no-files-found: error

  apk:
    needs: ui
    runs-on: ubuntu-24.04
    env:
      APK_OUT: src/Rust/apps/desktop/gen/android/app/build/outputs/apk
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
        with:
          install_args: rust
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # 既定の packages（"tools"）は今の cmdline-tools に無く sdkmanager が落ちるので、要るものを名指しする
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0 ndk;27.0.12077973
      - name: NDK と Rust の Android の target
        run: |
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ${{ env.DESKTOP }} -> target
          key: android-apk
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist-wasm
          path: src/Svelte/dist
      - name: tauri-cli を入れる
        run: cargo install tauri-cli --version 2.12.4 --locked
      - name: gen/android が無ければ作る（作ったものは artifact gen-android。コミットするのは人の手）
        working-directory: ${{ env.DESKTOP }}
        run: |
          if [ ! -d gen/android ]; then
            cargo tauri android init --ci
            echo "GEN_ANDROID_NEW=1" >> "$GITHUB_ENV"
          fi
      - if: env.GEN_ANDROID_NEW == '1'
        uses: actions/upload-artifact@v4
        with:
          name: gen-android
          path: |
            ${{ env.DESKTOP }}/gen/android
            !${{ env.DESKTOP }}/gen/android/**/build
            !${{ env.DESKTOP }}/gen/android/.gradle
          include-hidden-files: true
      - name: debug APK を作る（aarch64 は実機、x86_64 はエミュレータ）
        working-directory: ${{ env.DESKTOP }}
        run: cargo tauri android build --apk --debug --ci --target aarch64 --target x86_64
      - name: 鍵があれば keystore.properties を書く（build.gradle.kts がこれを見て release に署名する）
        working-directory: ${{ env.DESKTOP }}/gen/android
        # S218: 鍵は第三者の action に見えないよう、この step だけに渡す（secrets は if: に書けないので、空なら中で抜ける）
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || exit 0
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > keystore.properties
      - name: release APK を作る（ABI ごと。aarch64 は配布、x86_64 はエミュレータの smoke）
        working-directory: ${{ env.DESKTOP }}
        run: cargo tauri android build --apk --ci --split-per-abi --target aarch64 --target x86_64
      - name: APK の大きさ（debug と release を並べる）
        run: |
          {
            echo "| APK | バイト | MiB |"
            echo "| --- | ---: | ---: |"
            find "$APK_OUT" -name '*.apk' | sort | while read -r f; do
              b=$(stat -c %s "$f")
              echo "| ${f#"$APK_OUT"/} | $b | $(awk "BEGIN{printf \"%.1f\", $b/1048576}") |"
            done
            echo
            echo '```text'
            for f in $(find "$APK_OUT" -name '*.apk' | sort); do echo "$f"; unzip -l "$f" 'lib/*'; done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: globe-android
          path: ${{ env.APK_OUT }}/universal/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: globe-android-release
          path: ${{ env.APK_OUT }}/*/release/*.apk
          if-no-files-found: error
      - name: smoke 用の release APK（x86_64 を debuggable で作り直す。署名なしなら使い捨ての鍵で署名する。配布物は上で upload 済み）
        # Tauri（wry の Logger.kt）は BuildConfig.DEBUG のときだけ WebView の console を logcat に出すので、
        # 配布と同じ release（R8・release の Rust）のまま isDebuggable だけを立てる（build.gradle.kts の GM_SMOKE_DEBUGGABLE）
        working-directory: ${{ env.DESKTOP }}
        env:
          GM_SMOKE_DEBUGGABLE: "1"
        run: |
          cargo tauri android build --apk --ci --split-per-abi --target x86_64
          mkdir "$GITHUB_WORKSPACE/smoke"
          src=$(find "$GITHUB_WORKSPACE/$APK_OUT/x86_64/release" -name '*.apk' | head -1)
          case "$src" in
            *-unsigned.apk)
              # 使い捨て: この runner の中だけで作って捨てる。配布の鍵ではない（ランナーに debug.keystore は無い）
              keytool -genkeypair -keystore "$RUNNER_TEMP/smoke.jks" -storepass smoke1 -keypass smoke1 -alias smoke \
                -keyalg RSA -keysize 2048 -validity 1 -dname CN=smoke -noprompt
              "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign --ks "$RUNNER_TEMP/smoke.jks" \
                --ks-pass pass:smoke1 --ks-key-alias smoke --out "$GITHUB_WORKSPACE/smoke/app-x86_64-release-smoke.apk" "$src" ;;
            *) cp "$src" "$GITHUB_WORKSPACE/smoke/" ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: globe-android-smoke
          path: smoke/*.apk
          if-no-files-found: error

  emulator:
    needs: apk
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # S106: release は globe-android-smoke（x86_64 の release APK。署名なしなら使い捨ての鍵で署名した写し）
        include:
          - build: debug
            artifact: globe-android
            logcat: android-logcat
          - build: release
            artifact: globe-android-smoke
            logcat: android-logcat-release
    steps:
      - name: KVM を使えるようにする
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: apk
      - name: API 34 のエミュレータで起動し、UI からの検査と実行（GM-SMOKE の行）を待つ
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          # script は 1 行ずつ sh で回る
          script: |
            adb install -r "$(find apk -name '*.apk' | head -1)"
            adb logcat -c
            adb shell monkey -p "$APP_ID" -c android.intent.category.LAUNCHER 1
            for i in $(seq 180); do adb logcat -d | grep -q GM-SMOKE && break; sleep 5; done
            adb logcat -d > logcat.txt
            adb shell pidof "$APP_ID"
            grep -E "Displayed $APP_ID|$APP_ID.*(MainActivity|Tauri)" logcat.txt | head -20
            if grep -E "FATAL EXCEPTION|AndroidRuntime: Process: $APP_ID" logcat.txt; then exit 1; fi
            grep -m1 GM-SMOKE logcat.txt | tee -a "$GITHUB_STEP_SUMMARY"
            grep -q "GM-SMOKE check=ok simulate=ok .* msl=ok tree=ok fmt=ok graph=ok cancel=ok settings=ok plot=ok def=ok isolated=0 cancel_path=restart " logcat.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.logcat }}
          path: logcat.txt
