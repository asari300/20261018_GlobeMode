# GlobeMode Desktop（Tauri 2 のシェル。S049、計画書の WP-C、ADR-0023）の .deb と .msi を作る。
#
# 手動実行（workflow_dispatch）だけ。Release には付けない（artifact に残すだけ。署名は無い）。
# Desktop は別の Cargo workspace（src/Rust/apps/desktop）なので、ci.yml の `cargo build --workspace` には巻き込まれない。
# 手順: UI を 1 度だけビルド（ui）→ OS ごとに `globe`（sidecar）を release で作って target triple 付きの名前で置き、
# desktop の workspace を cargo deny・試験し、`cargo tauri build` で .deb（ubuntu-24.04）と .msi（windows-2025）を作る。
# Linux では .deb を入れて、xvfb でアプリを起動し、MSL を読ませた sidecar に ChuaCircuit を検査・実行させる smoke と、
# アプリと sidecar の最大の常駐メモリの記録も行う（S056。MSL は msl-sim.yml・ci.yml と同じ key で cache する）。
# S069: さらに MSL を渡さずに起動し直し、アプリが app data dir に MSL 4.1.0 を取得して（毎回、cache しない）検査・実行する smoke と、
# 取得済みの置き場を 2 度目の起動が見つけて使う smoke も回す。
# S143: 測定は globe-mode.toml のある作業ディレクトリから起動し、cfg=ok（整形が設定の indent を使う）を確かめる。
# S125: UI の測定（ADR-0034）。GLOBE_DESKTOP_BENCH で UI が Decay と MSL・ChuaCircuit の手順を測り、GM-SMOKE の行を書く。
# S147: 同じ行に UI の操作の項目（tree・fmt・graph・cancel・settings・plot・def）が付き、全部 ok を合格にする（Linux・Windows）。
# Linux と Windows で 3 回ずつ。行に最大の RSS（rss_kib）、末尾にインストーラの大きさ（GM-BUNDLE）を足し、artifact ui-bench-<os> に残す。Rust の fmt と clippy（-D warnings）もここで回す（手元に webkit2gtk が無いため）。
# `cargo install tauri-cli`（^2、--locked）を使う理由: npm の依存（@tauri-apps/cli）を増やさず、Rust の道具だけで済むため。
name: desktop

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MISE_AUTO_INSTALL: "false"

jobs:
  ui:
    # src/Svelte のビルド成果物（dist）。wasm は Desktop の UI に要らない（計算は sidecar）ので prepare-wasm は通さず、
    # `vite build` だけを回す（`pnpm build` は wasm:build の出力が無いと落ちる）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: node pnpm
      - working-directory: src/Svelte
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vite build
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: src/Svelte/dist
          if-no-files-found: error

  build:
    needs: ui
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux
            exe: ""
            bundle: deb
          - os: windows-2025
            name: windows
            exe: .exe
            bundle: msi
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      DESKTOP: src/Rust/apps/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        if: runner.os == 'Linux'
        with:
          install_args: rust cargo-deny
      # Windows では mise の shim 経由の cargo が失敗したので、ランナーの rustup を直接使う（release.yml と同じ）
      - if: runner.os == 'Windows'
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - name: Tauri 2 の依存（Linux）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev xvfb
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            ${{ env.DESKTOP }} -> target
          key: desktop-${{ matrix.name }}
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: src/Svelte/dist

      - name: sidecar の globe を release で作り、target triple 付きの名前で置く
        run: |
          cargo build --release --locked -p globe-mode-cli
          TRIPLE="$(rustc -vV | sed -n 's/^host: //p')"
          echo "TRIPLE=$TRIPLE" >> "$GITHUB_ENV"
          cp "target/release/globe${{ matrix.exe }}" "$DESKTOP/binaries/globe-$TRIPLE${{ matrix.exe }}"
          "target/release/globe${{ matrix.exe }}" --version

      - name: cargo deny（desktop の workspace。ルートの方針に Tauri の分だけ足した設定）
        if: runner.os == 'Linux'
        run: cargo deny --manifest-path "$DESKTOP/Cargo.toml" --config "$DESKTOP/deny.toml" check

      - name: fmt と clippy（desktop の workspace）と、MSL の URL・sha256 が xtask と同じこと
        if: runner.os == 'Linux'
        run: |
          # msl.rs は xtask の fetch-msl の定数（4.1.0 と S084 の 4.0.0）を写している（ADR-0030）。ずれたらここで落とす
          X=src/Rust/xtask/src/main.rs
          for pair in 'MSL_URL:URL' 'MSL_SHA256:SHA256' 'MSL_400_URL:MSL_400_URL' 'MSL_400_SHA256:MSL_400_SHA256'; do
            a="$(sed -n "s/^const ${pair%%:*}: &str = \"\(.*\)\";/\1/p" "$X")"
            b="$(sed -n "s/^const ${pair##*:}: &str = \"\(.*\)\";/\1/p" "$DESKTOP/src/msl.rs")"
            test -n "$a" && test "$a" = "$b" || { echo "${pair%%:*} が xtask と違う: '$a' / '$b'"; exit 1; }
          done
          cargo fmt --manifest-path "$DESKTOP/Cargo.toml" --check
          cargo clippy --manifest-path "$DESKTOP/Cargo.toml" --all-targets --locked -- -D warnings

      - name: 試験（sidecar の中継。本物の globe lsp に check・simulate・graph を頼む）
        env:
          GLOBE_BIN: ${{ github.workspace }}/target/release/globe${{ matrix.exe }}
        run: cargo test --release --locked --manifest-path "$DESKTOP/Cargo.toml"

      - name: tauri-cli を入れる
        run: cargo install tauri-cli --version "^2" --locked

      - name: ${{ matrix.bundle }} を作る
        working-directory: ${{ env.DESKTOP }}
        run: cargo tauri build --bundles ${{ matrix.bundle }}

      - name: 成果物の大きさ
        run: |
          ls -l "$DESKTOP"/target/release/bundle/${{ matrix.bundle }}/*.${{ matrix.bundle }} | tee -a "$GITHUB_STEP_SUMMARY"

      - name: MSL 4.1.0 を取得する（smoke 用。msl-sim.yml・ci.yml と同じ cache）
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: data/msl
          key: msl-${{ hashFiles('src/Rust/xtask/src/main.rs') }}
      - name: fetch-msl
        if: runner.os == 'Linux'
        run: cargo xtask fetch-msl

      - name: smoke（.deb を入れ、xvfb でアプリを起動。MSL を読んだ sidecar に ChuaCircuit を検査・実行させ、最大の常駐メモリを記録する）
        if: runner.os == 'Linux'
        env:
          GLOBE_DESKTOP_SMOKE: "1"
          GLOBE_DESKTOP_SMOKE_MODEL: Modelica.Electrical.Analog.Examples.ChuaCircuit
          GLOBE_LIBRARY: ${{ github.workspace }}/data/msl
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
        run: |
          DEB="$(find "$PWD/$DESKTOP/target/release/bundle/deb" -maxdepth 1 -type f -name '*.deb')"
          sudo apt-get install -y "$DEB"
          PKG="$(dpkg-deb -f "$DEB" Package)"
          dpkg -L "$PKG" | grep -E '^/usr/(bin|lib)' | tee -a "$GITHUB_STEP_SUMMARY"
          APP="$(dpkg -L "$PKG" | grep '^/usr/bin/' | grep -v '/globe$' | head -1)"
          echo "app=$APP"
          ls -l /usr/bin/globe
          # time -v の Maximum resident はプロセス木の最大。アプリ単体と sidecar 単体の VmHWM はアプリが表示する
          /usr/bin/time -v -o time.txt timeout 600 xvfb-run -a "$APP" 2>&1 | tee smoke.txt || { cat time.txt; exit 1; }
          cat time.txt | grep -E "Maximum resident|Elapsed" | tee -a smoke.txt
          grep -q "smoke: ok passed=true" smoke.txt
          grep -q "smoke: simulate ok=true" smoke.txt
          { echo '```'; cat smoke.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

          # S069: MSL を渡さない。1 度目は app data dir に MSL 4.1.0 を取得（GLOBE_DESKTOP_SMOKE_FETCH）して検査・実行、
          # 2 度目は取得なしで、取得済みの置き場（目印あり）を起動時に見つけて検査・実行できる
          STORE="$HOME/.local/share/io.github.asari300.globemode/msl/4.1.0"
          rm -rf "$HOME/.local/share/io.github.asari300.globemode"
          env -u GLOBE_LIBRARY GLOBE_DESKTOP_SMOKE_FETCH=1 /usr/bin/time -v -o time-fetch.txt \
            timeout 900 xvfb-run -a "$APP" 2>&1 | tee smoke-fetch.txt
          grep -E "Maximum resident|Elapsed" time-fetch.txt | tee -a smoke-fetch.txt
          grep -q "smoke: fetched msl" smoke-fetch.txt
          grep -q "smoke: ok passed=true" smoke-fetch.txt
          grep -q "smoke: simulate ok=true" smoke-fetch.txt
          test -f "$STORE/.globe-mode-msl"
          env -u GLOBE_LIBRARY timeout 600 xvfb-run -a "$APP" 2>&1 | tee smoke-reuse.txt
          if grep -q "smoke: fetched msl" smoke-reuse.txt; then echo "2 度目の起動で取得した"; exit 1; fi
          grep -q "smoke: simulate ok=true" smoke-reuse.txt
          { echo '取得して使う smoke:'; echo '```'; cat smoke-fetch.txt; echo '```'; echo '2 度目の起動:'; echo '```'; cat smoke-reuse.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: UI の測定（Linux。S125。取得済みの MSL を UI の手順の中で読む。RSS は time -v の木の中の最大）
        if: runner.os == 'Linux'
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          # S125 は LANG=en_US.UTF-8 をここで足していた（ランナーの既定 C.UTF-8 で白画面）。S134 でアプリが直すので外した
        run: |
          echo "LANG=${LANG-} LC_ALL=${LC_ALL-} LC_CTYPE=${LC_CTYPE-}"
          DEB="$(find "$PWD/$DESKTOP/target/release/bundle/deb" -maxdepth 1 -type f -name '*.deb')"
          APP="$(dpkg -L "$(dpkg-deb -f "$DEB" Package)" | grep '^/usr/bin/' | grep -v '/globe$' | head -1)"
          # S143: globe-mode.toml（indent = 4）を置いた作業ディレクトリから起動する。アプリは作業ディレクトリを sidecar の根にし、
          # UI の整形が設定ファイルの indent を使えば GM-SMOKE の行に cfg=ok が付く
          W="$PWD"; CFG="$(mktemp -d)"; printf '[fmt]\nindent = 4\n' > "$CFG/globe-mode.toml"
          # S154: 作業ディレクトリの Recent.mo を、UI が最近使ったファイルとして開く（dialog を通さない path。GM-SMOKE の recent=ok）
          printf 'model Recent\nend Recent;\n' > "$CFG/Recent.mo"
          for i in 1 2 3; do
            rm -f line.txt
            (cd "$CFG" && GLOBE_DESKTOP_BENCH="$W/line.txt" /usr/bin/time -v -o "$W/time-bench.txt" timeout 300 xvfb-run -a "$APP") || echo "終了コード $?"
            test -s line.txt || { echo "GM-SMOKE の行が無い"; exit 1; }
            echo "$(cat line.txt) rss_kib=$(sed -n 's/.*Maximum resident set size (kbytes): //p' time-bench.txt)" >> bench.txt
          done
          echo "GM-BUNDLE kib=$(( $(stat -c %s "$DEB") / 1024 ))" >> bench.txt
          { echo '```'; cat bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          test "$(grep -c 'GM-SMOKE check=ok simulate=ok .* msl=ok cfg=ok tree=ok fmt=ok graph=ok cancel=ok settings=ok plot=ok def=ok recent=ok ' bench.txt)" = 3

      - name: UI の測定（Windows。S125。先に Rust の smoke で MSL を取得し、測る回にダウンロードを含めない。RSS はプロセスごとの PeakWorkingSet の最大）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = (Get-ChildItem "$env:DESKTOP\target\release\*.exe" | Where-Object Name -ne 'globe.exe' | Select-Object -First 1).FullName
          $env:GLOBE_SIDECAR = "$PWD\target\release\globe.exe"
          $env:GLOBE_DESKTOP_SMOKE = "1"; $env:GLOBE_DESKTOP_SMOKE_FETCH = "1"
          $p = Start-Process $app -PassThru
          if (-not $p.WaitForExit(900000)) { $p.Kill(); throw "取得の smoke が時間切れ" }
          if ($p.ExitCode -ne 0) { throw "取得の smoke が失敗（$($p.ExitCode)）" }
          Remove-Item Env:GLOBE_DESKTOP_SMOKE, Env:GLOBE_DESKTOP_SMOKE_FETCH
          $env:GLOBE_DESKTOP_BENCH = "$PWD\line.txt"
          Set-Content Recent.mo "model Recent`nend Recent;" # S154: 作業ディレクトリの Recent.mo を最近使ったファイルとして開く
          foreach ($i in 1..3) {
            Remove-Item line.txt -ErrorAction SilentlyContinue
            $p = Start-Process $app -PassThru; $peak = 0; $deadline = (Get-Date).AddMinutes(10)
            while (-not $p.HasExited) {
              $m = (Get-Process globe-mode-desktop, GlobeMode, globe, msedgewebview2 -ErrorAction SilentlyContinue | Measure-Object PeakWorkingSet64 -Maximum).Maximum
              if ($m -gt $peak) { $peak = $m }
              if ((Get-Date) -gt $deadline) { $p.Kill(); throw "測定が時間切れ" }
              Start-Sleep -Milliseconds 200
            }
            if (-not (Test-Path line.txt)) { throw "GM-SMOKE の行が無い（終了コード $($p.ExitCode)）" }
            "$((Get-Content line.txt -Raw).Trim()) rss_kib=$([math]::Round($peak / 1024))" | Add-Content bench.txt
          }
          $msi = Get-ChildItem "$env:DESKTOP\target\release\bundle\msi\*.msi" | Select-Object -First 1
          "GM-BUNDLE kib=$([math]::Round($msi.Length / 1024))" | Add-Content bench.txt
          Get-Content bench.txt
          "``````", (Get-Content bench.txt), "``````" | Add-Content $env:GITHUB_STEP_SUMMARY
          if (@(Select-String 'GM-SMOKE check=ok simulate=ok .* msl=ok cfg=\w+ tree=ok fmt=ok graph=ok cancel=ok settings=ok plot=ok def=ok recent=ok ' bench.txt).Count -ne 3) { throw "ok でない回がある" }

      - uses: actions/upload-artifact@v4
        with:
          name: ui-bench-${{ matrix.name }}
          path: bench.txt
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: desktop-linux-smoke
          path: |
            smoke.txt
            time.txt
            time-fetch.txt
            smoke-fetch.txt
            smoke-reuse.txt
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: ${{ env.DESKTOP }}/target/release/bundle/${{ matrix.bundle }}/*.${{ matrix.bundle }}
          if-no-files-found: error
