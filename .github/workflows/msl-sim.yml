# MSL の全例題の検査（msl:funnel）と実行・参照結果との比較（msl:sim）を GitHub Actions で回す（S037）。
#
# 手元の機械（RAM 3 GB）では msl:funnel の最大 RSS 7.2 GiB が swap に乗って遅いので、ランナー（16 GB）で回す。
# 手動だけ（Actions の画面か `gh workflow run msl-sim.yml`）。push の CI（ci.yml）には入れない。
# 報告（doc/msl-funnel.md・doc/msl-sim.md）と JSON は artifact に残す。コミットは手元で artifact を取ってから行う。
# 前回の target/msl-sim.json はキャッシュから戻し、前回との差を報告に書く。
# ジョブ split-all（S043）は wasm の分割読み込み（S037）が全部読みと同じ検査結果を返すかを全例題で確かめる。
# msl-sim と並行に回し（needs を付けない）、こちらが落ちても msl-sim は止まらない。
# ジョブ solvers・solvers-report（S050）は、msl-sim の後にソルバごとに msl-sim を回して、ソルバ別の表（doc/msl-solvers.md）を作る。
name: msl-sim

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: msl-sim
  cancel-in-progress: false

jobs:
  msl-sim:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: rust
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v6
        with:
          path: data/msl
          key: msl-${{ hashFiles('src/Rust/xtask/src/main.rs') }}
      - uses: actions/cache@v6
        with:
          path: data/msl-ref
          key: msl-ref-${{ hashFiles('src/Rust/xtask/src/reference.rs') }}
      # 前回の結果。キーは毎回新しく、restore-keys で一番新しいものを戻す
      - uses: actions/cache@v6
        with:
          path: target/msl-sim.json
          key: msl-sim-json-${{ github.run_id }}
          restore-keys: msl-sim-json-
      # mise run は mise.toml のツールをすべて入れようとし、elixir がランナーの glibc で落ちる（run 41170268465）。
      # mise.toml の msl:funnel と msl:sim と同じコマンドを直接呼ぶ
      - run: cargo xtask fetch-msl
      - run: cargo xtask msl-funnel --report doc/msl-funnel.md --json target/msl-funnel.json
      - run: cargo xtask msl-sim --funnel-json target/msl-funnel.json --tolerance-scale 0.1 --fetch-ref --baseline-json target/msl-sim.json --report doc/msl-sim.md --json target/msl-sim.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: msl-sim
          path: |
            doc/msl-funnel.md
            doc/msl-sim.md
            target/msl-funnel.json
            target/msl-sim.json

  # 例題の一覧は `msl-funnel --list`（索引だけで、検査はしない）から取る。funnel の JSON を待たないので並行に回せる。
  # 不一致は一覧にして出す（最初の 1 本で止めない）。モデルごとに分割読み込みの検査器を作り直す（GM_SPLIT_FRESH。
  # 先のモデルが読んだファイルが残ると閉包の足りなさを隠すため）。時間が足りなければ FRESH を外す。
  split-all:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: rust
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v6
        with:
          path: data/msl
          key: msl-${{ hashFiles('src/Rust/xtask/src/main.rs') }}
      - run: cargo xtask fetch-msl
      - run: cargo xtask msl-funnel --list > split-models.txt
      - run: wc -l split-models.txt
      - run: cargo test --release -p globe-mode-frontend --test split -- --ignored --nocapture msl_examples_match_the_full_load 2>&1 | tee split-all.log
        shell: bash
        env:
          GM_SPLIT_MODELS: ${{ github.workspace }}/split-models.txt
          GM_SPLIT_FRESH: "1"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: split-all
          path: |
            split-models.txt
            split-all.log

  # S050: ソルバごとに msl-funnel で OK の例題を実行し、参照結果の管で比べる。msl-sim ジョブの funnel の JSON を使う。
  # 並べるのは「自前または diffsol の、刻み幅を制御する積分器」。`auto` の行は msl-sim ジョブの結果を使う。
  #   - 入れない: qss（事象ごとに f 全体を呼び、硬い系は壁時計の上限で止まる。時間がかかる割に比べる意味が薄い）、
  #     euler・heun・rk4・impeuler・trapezoid（固定刻み。既定の刻み＝出力の間隔では精度が足りず、管に収まる本数に意味が出ない）、
  #     esdirk23（trbdf2 と同じ方法で、刻みの端の値は一致する）、別名（dassl・lsodar・rk45・dopri5）。
  #   - cvode・ida は feature `sundials`（SUNDIALS を cmake で同梱のソースからビルドする。ランナーに cmake が入っている）。
  #     ワーカーは xtask 自身なので、xtask のビルドに `--features globe-mode-exec/sundials` を付ければ届く。
  # 基準（baseline）は渡さない。1 ソルバは 60 分前後【未確認】、上限は 300 分。
  solvers:
    needs: msl-sim
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        solver: [bdf, dopri45, esdirk34, trbdf2, tsit45, esdirk45, sdirk34hw, dopri853, cerk23, cerk34, cerk45, radau5, cvode, ida]
    env:
      # cvode・ida だけ sundials つき（それ以外のビルドは msl-sim ジョブと同じ）
      SUNDIALS: ${{ (matrix.solver == 'cvode' || matrix.solver == 'ida') && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: rust
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.SUNDIALS == 'true' && 'sundials' || 'plain' }}
      - uses: actions/cache@v6
        with:
          path: data/msl
          key: msl-${{ hashFiles('src/Rust/xtask/src/main.rs') }}
      - uses: actions/cache@v6
        with:
          path: data/msl-ref
          key: msl-ref-${{ hashFiles('src/Rust/xtask/src/reference.rs') }}
      - uses: actions/download-artifact@v8
        with:
          name: msl-sim
      - run: cargo xtask fetch-msl
      - name: msl-sim --solver ${{ matrix.solver }}
        shell: bash
        run: |
          features=""
          if [ "$SUNDIALS" = true ]; then features="--features globe-mode-exec/sundials"; fi
          cargo run --release -q -p xtask $features -- msl-sim --solver ${{ matrix.solver }} --funnel-json target/msl-funnel.json --tolerance-scale 0.1 --fetch-ref --report target/msl-sim-${{ matrix.solver }}.md --json target/msl-sim-${{ matrix.solver }}.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: msl-sim-solver-${{ matrix.solver }}
          path: |
            target/msl-sim-${{ matrix.solver }}.md
            target/msl-sim-${{ matrix.solver }}.json

  # 全ソルバの JSON を集めて表にする。落ちたソルバがあっても、できた分で表を作る（if: always()）。
  solvers-report:
    needs: [msl-sim, solvers]
    if: always() && needs.msl-sim.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: rust
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          name: msl-sim
      - uses: actions/download-artifact@v8
        with:
          pattern: msl-sim-solver-*
          merge-multiple: true
          path: target
      - run: cargo xtask msl-solvers --inputs target/msl-sim.json target/msl-sim-*.json --report doc/msl-solvers.md
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: msl-solvers
          path: doc/msl-solvers.md
