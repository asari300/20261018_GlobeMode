# VS Code の拡張を本物の VS Code（stable）の中で確かめる（S165、P4）。手動（workflow_dispatch）と、main への src/VSCode/** の push だけ。ci.yml には入れない（重いので）。
#
# S233 から Linux・Windows・macOS の 3 OS（fail-fast: false）。xvfb-run と apt は Linux だけ。Windows は rustup を直接使う（ci.yml の rust-windows と同じ理由）。
#
# 中身: `globe` を release でビルドして PATH に置き、拡張を束ね（pnpm build）、@vscode/test-electron が取得した VS Code を xvfb の中で起動して
# src/VSCode/globe-mode/e2e/suite.cjs を拡張ホストで回す（言語 ID と activate、構文の誤りの診断、アウトライン、rename）。
# その前に pnpm test（lsp.test.mjs ほか。ci.yml は拡張の node --test を回さない）と、Oniguruma での文法の試験（grammar-onig.test.mjs）も回す。
name: vscode

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/VSCode/**"
      - ".github/workflows/vscode.yml"

permissions:
  contents: read

concurrency:
  group: vscode-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MISE_AUTO_INSTALL: "false"

jobs:
  e2e:
    name: e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      # Windows では mise の shim 経由の cargo が rustc -vV で失敗した（ci.yml の rust-windows、run 39091325647）。rust は全 OS で rustup を直接使う
      - run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - uses: jdx/mise-action@v5
        with:
          install_args: node pnpm
      - uses: Swatinem/rust-cache@v2
        with:
          key: vscode-${{ matrix.os }}
      - run: cargo build --release -p globe-mode-cli
      # PATH に足すのは $GITHUB_PATH で（Windows の bash で \ の入るパスを export しない）
      - run: echo "${{ github.workspace }}/target/release" >> "$GITHUB_PATH"
      - name: 拡張を束ねて、VS Code を起動しない試験を回す
        working-directory: src/VSCode/globe-mode
        env:
          GLOBE_BIN: ${{ github.workspace }}/target/release/globe${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm test
      - name: VS Code に要る共有ライブラリ（ランナーに無いものだけ入る）
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgbm1 libnss3 libasound2t64 libgtk-3-0t64 libxss1
      - name: VS Code を起動して拡張を試す
        working-directory: src/VSCode/globe-mode
        run: |
          command -v globe
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a pnpm test:vscode; else pnpm test:vscode; fi
