# Export した FMU（P5a、Rumoca のテンプレート）を FMPy と fmusim で確かめる（S098、ADR-0031）。
#
# 手元では外から取った fmusim のバイナリを実行できないので、ランナーで回す。手動だけ（`gh workflow run fmu-export.yml`）。
# FMI 2.0 と 3.0 のそれぞれで `globe fmu export --build` → FMPy の validate・simulate（ME・CS）→ fmusim の validate・simulate（ME・CS）。
# モデルは GlobeModeValidation.Simulation.Decay（der(x) = -x、x(0) = 1）。x(1) と e⁻¹ の差を出す。
# S105: Ubuntu で `--target`（zig cc）を 3 つ付けて linux64・win64・darwin64（3.0 は x86_64-linux・x86_64-windows・aarch64-darwin）を
# 1 つの FMU に入れ、artifact で Ubuntu・Windows・macOS（arm64）に渡して各 OS の FMPy で validate と ME・CS の simulate を回す。
name: fmu-export

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fmu-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # fmusim（modelica/fmusim、BSD-2-Clause）の release。sha256 は S094 で確かめたもの
      FMUSIM_URL: https://github.com/modelica/fmusim/releases/download/v0.15.0/fmusim-x86_64-linux.zip
      FMUSIM_SHA256: d92bd9054ac9693d263c4d68e75a6dd4d540cdd415c178dd75521571ed9e29a0
      MODEL: GlobeModeValidation.Simulation.Decay
      # S148: zig は ziglang.org から直接取る（コミュニティのミラーが 502・500 で落ちた: run 41702810070）。署名は mise が検証する
      MISE_ZIG_USE_COMMUNITY_MIRRORS: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: rust uv zig
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p globe-mode-cli --bin globe
      - name: fmusim を取得する
        run: |
          mkdir -p "$RUNNER_TEMP/fmusim" && cd "$RUNNER_TEMP/fmusim"
          curl -sSfL -o fmusim.zip "$FMUSIM_URL"
          echo "$FMUSIM_SHA256  fmusim.zip" | sha256sum -c
          unzip -q fmusim.zip && chmod +x fmusim
          echo "$RUNNER_TEMP/fmusim" >> "$GITHUB_PATH"
      - run: fmusim --version
      - name: FMI 2.0 と 3.0 を出して FMPy と fmusim で回す
        run: |
          fmpy() { uv run --no-project --with fmpy==0.3.32 python -I -c "import sys; from fmpy.cli import main; sys.argv = ['fmpy'] + sys.argv[1:]; main()" "$@"; }
          last_x() { python3 -I -c "import csv, math, sys; r = list(csv.reader(open(sys.argv[1]))); h = r[0]; row = r[-1]; x = float(row[[c.strip().strip('\"') for c in h].index('x')]); print(f'{sys.argv[2]}: t = {row[0]}, x(1) = {x!r}, x(1) - e^-1 = {x - math.exp(-1):.3e}')" "$@"; }
          headers=$(uv run --no-project --with fmpy==0.3.32 python -I -c "import fmpy, os; print(os.path.join(os.path.dirname(fmpy.__file__), 'c-code'))")
          for v in 2 3; do
            out="$RUNNER_TEMP/fmi$v"
            fmu="$out/${MODEL//./_}-fmi$v.fmu"
            target/debug/globe fmu export src/Modelica/GlobeModeValidation -m "$MODEL" --out "$out" --fmi-version "$v" --build --fmi-headers "$headers"
            unzip -l "$fmu"
            fmpy validate "$fmu"
            fmusim validate "$fmu"
            for it in ModelExchange CoSimulation; do
              fmpy simulate "$fmu" --interface-type "$it" --relative-tolerance 1e-8 --stop-time 1 --output-variables x --output-file "$out/fmpy-$it.csv"
              last_x "$out/fmpy-$it.csv" "FMI $v FMPy $it" | tee -a "$RUNNER_TEMP/summary.txt"
            done
            for it in me cs; do
              fmusim simulate "$fmu" --interface-type "$it" --stop-time 1 --output-variable x --output-file "$out/fmusim-$it.csv"
              last_x "$out/fmusim-$it.csv" "FMI $v fmusim $it" | tee -a "$RUNNER_TEMP/summary.txt"
            done
          done
          { echo '```text'; cat "$RUNNER_TEMP/summary.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # S231: P5b（自前のランタイム globe-mode-fmu）の Co-Simulation。ME と CS を 1 つの FMU に書き、CS を FMPy と fmusim で回す
      - name: P5b の CS を FMPy と fmusim で確かめる（S231）
        run: |
          fmpy() { uv run --no-project --with fmpy==0.3.32 python -I -c "import sys; from fmpy.cli import main; sys.argv = ['fmpy'] + sys.argv[1:]; main()" "$@"; }
          last_x() { python3 -I -c "import csv, math, sys; r = list(csv.reader(open(sys.argv[1]))); h = r[0]; row = r[-1]; x = float(row[[c.strip().strip('\"') for c in h].index('x')]); print(f'{sys.argv[2]}: t = {row[0]}, x(1) = {x!r}, x(1) - e^-1 = {x - math.exp(-1):.3e}')" "$@"; }
          cargo build --release -p globe-mode-fmu
          mo=src/Modelica/GlobeModeValidation/Simulation/Decay.mo
          for v in 2 3; do
            out="$RUNNER_TEMP/p5b$v"; mkdir -p "$out"
            cargo run -q --release -p globe-mode-fmu --example md -- "$mo" "$MODEL" "$v" both > "$out/modelDescription.xml"
            python3 -I - "$out" "$v" "$MODEL" "$mo" <<'PY'
          import sys, zipfile
          out, v, model, mo = sys.argv[1:]
          with zipfile.ZipFile(f"{out}/p5b.fmu", "w") as z:
              z.write(f"{out}/modelDescription.xml", "modelDescription.xml")
              z.write("target/release/libglobe_mode_fmu.so", f"binaries/{'x86_64-linux' if v == '3' else 'linux64'}/globe_mode_fmu.so")
              z.write(mo, f"resources/{model}.mo")
          PY
            fmu="$out/p5b.fmu"
            fmpy validate "$fmu"
            fmusim validate "$fmu"
            fmpy simulate "$fmu" --interface-type CoSimulation --relative-tolerance 1e-8 --stop-time 1 --output-variables x --output-file "$out/fmpy-cs.csv"
            last_x "$out/fmpy-cs.csv" "P5b FMI $v FMPy CoSimulation" | tee -a "$RUNNER_TEMP/summary.txt"
            fmusim simulate "$fmu" --interface-type cs --stop-time 1 --output-variable x --output-file "$out/fmusim-cs.csv"
            last_x "$out/fmusim-cs.csv" "P5b FMI $v fmusim cs" | tee -a "$RUNNER_TEMP/summary.txt"
          done
          { echo '```text'; cat "$RUNNER_TEMP/summary.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Enumeration と String のモデルを FMPy と fmusim で確かめる（S224）
        run: |
          fmpy() { uv run --no-project --with fmpy==0.3.32 python -I -c "import sys; from fmpy.cli import main; sys.argv = ['fmpy'] + sys.argv[1:]; main()" "$@"; }
          headers=$(uv run --no-project --with fmpy==0.3.32 python -I -c "import fmpy, os; print(os.path.join(os.path.dirname(fmpy.__file__), 'c-code'))")
          # speed = fast（ordinal 2）なので x(1) = e^-2。2.0 は <Enumeration declaredType> と TypeDefinitions、3.0 は Rumoca のまま（Int32）
          check() { python3 -I -c "import csv, math, sys; r = list(csv.reader(open(sys.argv[1]))); i = [c.strip().strip('\"') for c in r[0]].index('x'); x = float(r[-1][i]); print(f'{sys.argv[2]}: x(1) = {x!r}, x(1) - e^-2 = {x - math.exp(-2):.3e}'); sys.exit(abs(x - math.exp(-2)) > 1e-6)" "$@"; }
          for v in 2 3; do
            out="$RUNNER_TEMP/enum$v"
            fmu="$out/GlobeModeValidation_Simulation_EnumString-fmi$v.fmu"
            target/debug/globe fmu export src/Modelica/GlobeModeValidation -m GlobeModeValidation.Simulation.EnumString --out "$out" --fmi-version "$v" --build --fmi-headers "$headers"
            unzip -p "$fmu" modelDescription.xml | grep -E "TypeDefinitions|Enumeration|String|Start"
            fmpy validate "$fmu"
            fmusim validate "$fmu"
            for it in ModelExchange CoSimulation; do
              fmpy simulate "$fmu" --interface-type "$it" --relative-tolerance 1e-8 --stop-time 1 --output-variables x --output-file "$out/fmpy-$it.csv"
              check "$out/fmpy-$it.csv" "FMI $v FMPy $it"
            done
            for it in me cs; do
              fmusim simulate "$fmu" --interface-type "$it" --stop-time 1 --output-variable x --output-file "$out/fmusim-$it.csv"
              check "$out/fmusim-$it.csv" "FMI $v fmusim $it"
            done
          done
      - name: zig cc で 3 つの OS 向けの FMU を作る（S105）
        run: |
          headers=$(uv run --no-project --with fmpy==0.3.32 python -I -c "import fmpy, os; print(os.path.join(os.path.dirname(fmpy.__file__), 'c-code'))")
          for v in 2 3; do
            out="$RUNNER_TEMP/cross/fmi$v"
            target/debug/globe fmu export src/Modelica/GlobeModeValidation -m "$MODEL" --out "$out" --fmi-version "$v" --build --fmi-headers "$headers" \
              --target x86_64-linux-gnu --target x86_64-windows-gnu --target aarch64-macos
            unzip -l "$out/${MODEL//./_}-fmi$v.fmu"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: fmu-cross
          path: ${{ runner.temp }}/cross/*/*.fmu

  # S105: zig cc で作った FMU を各 OS の FMPy で回す
  fmu-cross:
    needs: fmu-export
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: jdx/mise-action@v5
        with:
          install_args: uv
          # checkout しないので mise.toml が無い
          mise_toml: |
            [tools]
            uv = "latest"
      - uses: actions/download-artifact@v4
        with:
          name: fmu-cross
          path: fmu
      - name: FMPy で validate と ME・CS
        run: |
          py() { uv run --no-project --with fmpy==0.3.32 python -I "$@"; }
          fmpy() { py -c "import sys; from fmpy.cli import main; sys.argv = ['fmpy'] + sys.argv[1:]; main()" "$@"; }
          for v in 2 3; do
            fmu="fmu/fmi$v/GlobeModeValidation_Simulation_Decay-fmi$v.fmu"
            fmpy validate "$fmu"
            for it in ModelExchange CoSimulation; do
              fmpy simulate "$fmu" --interface-type "$it" --relative-tolerance 1e-8 --stop-time 1 --output-variables x --output-file "out-$v-$it.csv"
              py -c "import csv, math, sys; r = list(csv.reader(open(sys.argv[1]))); x = float(r[-1][1]); d = x - math.exp(-1); print(f'{sys.argv[2]}: t = {r[-1][0]}, x(1) = {x!r}, x(1) - e^-1 = {d:.3e}'); sys.exit(abs(d) > 1e-6)" \
                "out-$v-$it.csv" "${{ runner.os }} FMI $v FMPy $it" | tee -a summary.txt
            done
          done
          { echo '```text'; cat summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
