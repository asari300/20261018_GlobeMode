# ブラウザ版の配布物（S145、P6、ADR-0023 の「Web」）。手動実行（workflow_dispatch）だけ。静的ファイルの束を artifact `globe-web` に残す。
# 公開（GitHub Pages の有効化・URL の配布）はしない。それはユーザーの判断で、手順は doc/sessions/S145-web-bundle/解説書.md。
# 中身: wasm の UI（vite build。base は相対 ./ なのでどのサブパスに置いても動く）、MSL の分割配信（pack-msl.mjs。msl/index.json と msl/c/*.json。S301 から MSL.json は入れない）、
# CSP の header の断片（_headers = Cloudflare Pages / Netlify、nginx.csp.conf = nginx）。CSP は index.html の meta が正（scripts/web-bundle.sh が取り出す）。
# 大きさ（生・gzip・brotli）は Step Summary に出す。
# S380: 束にサードパーティのライセンス表（THIRD-PARTY-wasm.md・THIRD-PARTY-npm.md）と CycloneDX の SBOM（sbom-*.cdx.json）も入れる（release.yml と同じ道具・版）。
name: web

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MISE_AUTO_INSTALL: "false"

jobs:
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: rust github:wasm-bindgen/wasm-bindgen node pnpm uv github:CycloneDX/cyclonedx-rust-cargo
      - uses: Swatinem/rust-cache@v2
        with:
          key: web-wasm
      - run: cargo xtask fetch-msl
      - name: release の wasm と UI（pnpm build。MSL.json も作る）
        run: |
          mise run wasm:build
          cd src/Svelte
          pnpm install --frozen-lockfile
          pnpm build
          test -s dist/msl/MSL.json
          test -s dist/msl/index.json
      - name: ブラウザで確かめる（dist をサブパス /app/ で配って検査と MSL の読み込み、幅 400 px）
        run: |
          uv sync --locked
          uv run playwright install --with-deps chromium
          uv run python src/Svelte/tests/test_ui.py
      - name: 配布物にまとめて大きさを測る
        run: |
          command -v brotli > /dev/null || sudo apt-get install -y brotli
          bash src/Svelte/scripts/web-bundle.sh src/Svelte/dist globe-web | tee size.md
          { echo "### globe-web の大きさ"; echo; cat size.md; } >> "$GITHUB_STEP_SUMMARY"
          # S301: 束は分割配信だけ（MSL.json を入れない）。索引の塊の番号が、塊のファイルに全部ある
          test -s globe-web/msl/index.json
          test ! -e globe-web/msl/MSL.json
          node -e 'const i=JSON.parse(require("fs").readFileSync("globe-web/msl/index.json"));for(let k=0;k<i.chunks;k++)require("fs").statSync(`globe-web/msl/c/${k}.json`);console.log("塊",i.chunks,"本")'
      - name: ライセンス表と SBOM を束に入れる（許可外のライセンスがあれば失敗する。cargo-about の版は release.yml と同じ）
        run: |
          cargo install --locked --features cli --version 0.9.2 cargo-about
          cargo about generate --locked --fail --target wasm32-unknown-unknown --manifest-path src/Rust/mod/globe-mode-wasm/Cargo.toml about.hbs -o globe-web/THIRD-PARTY-wasm.md
          (cd src/Svelte && pnpm licenses list --long --json) | python3 .github/scripts/npm_licenses.py > globe-web/THIRD-PARTY-npm.md
          bash .github/scripts/make_sbom.sh globe-web wasm npm
          ls -l globe-web | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: globe-web
          path: globe-web
          if-no-files-found: error
