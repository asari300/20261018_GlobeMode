[settings]
lockfile = true                    # 解決した正確なバージョンを mise.lock に記録する

[settings.erlang]
precompiled_os = "ubuntu-26.04"    # Ubuntu 26.04 は自動判定されないので明示する
# compile = true                   # プリコンパイル版が無いときは kerl でソースビルド (3-3 の apt が必要)

[tools]
uv     = "0.13.1"                    # pyproject.toml の build-backend は maturin（S039）。uv 自体の版はここで固定
rust   = { version = "stable", profile = "default", components = ["rust-analyzer"], targets = "wasm32-unknown-unknown,wasm32-wasip2,aarch64-linux-android" }  # edition 2024 は 1.85 以上。rust-toolchain.toml は置かない
cargo-deny = "0.20.2"             # ライセンスと依存の監査（doc/licenses.md）
"github:wasm-bindgen/wasm-bindgen" = "0.2.129"  # S012: wasm の束ねの JS の糊（wasm-bindgen --target nodejs）。版は Cargo.lock の wasm-bindgen と必ず同じにする
node   = "24.22.0"                   # S041: src/Svelte のビルド（Vite）と wasm の Node 試験。版は ADR-0003 と同じく mise.lock で固定
pnpm   = "12.14.0"                   # S041: src/Svelte の npm 依存。ロックは src/Svelte/pnpm-lock.yaml
zig    = "latest"
julia  = "latest"
erlang = "27"                      # いま apt で入っている組み合わせと同じ
elixir = "1.18.3-otp-27"           # erlang のメジャー番号と -otp-NN を必ず揃える
gleam  = "latest"

[tasks.check]
description = "CI の判定のテスト、Rust の fmt / clippy / test / deny と、uv.lock の整合を確かめる"
run = [
  "python3 .claude/hooks/test_save_session_log.py",   # S218: 伏せ字の規則
  "python3 .github/scripts/test_ci_plan.py",   # CI の plan ジョブと同じ。crate の依存を変えたときに手元で気づくため（S005 の CI の失敗から）
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo test --workspace",
  "cargo deny check",
  "cargo run -q -p globe-mode-cli -- fmt --check src/Modelica",   # S189: 検証用ライブラリは globe fmt で整形してある
  "uv sync --locked",
]

[tasks."ci:plan"]
description = "origin/main との差分で、CI が何を検査するかを表示する（ADR-0006）"
run = "python3 .github/scripts/ci_plan.py --base origin/main --head HEAD"

[tasks."msl:compare"]
description = "MSL 4.1.0 と Rumoca の CLI を取得し、例題 20 本で globe check と突き合わせる"
run = [
  "cargo xtask fetch-msl",
  "cargo xtask fetch-rumoca",
  "cargo xtask msl-compare",
]

[tasks."msl:funnel"]
description = "MSL 4.1.0 の全例題（Examples の下、566 本）に globe check の判定を出し、報告 doc/msl-funnel.md を書く（S005。S007 から置き場を固定。S008 から JSON も target/ に残す）"
run = [
  "cargo xtask fetch-msl",
  "cargo xtask msl-funnel --report doc/msl-funnel.md --json target/msl-funnel.json",
]

[tasks."msl:sim"]
description = "msl:funnel で OK になった MSL の例題（target/msl-funnel.json）を実行し、MAP-LIB の参照結果（v4.1.0。初回は約 1 GB を data/msl-ref/ に取得）と管で比べ、報告 doc/msl-sim.md を書く（S011。別プロセスのワーカーで回し、時間切れは外から止める。S012 から既定のソルバは auto、時間切れは予算 180 s で回し直し、前回の target/msl-sim.json との差を書く。S013 から注釈の Tolerance を参照結果と同じ 0.1 倍にする）"
run = [
  "cargo xtask fetch-msl",
  "cargo xtask msl-sim --funnel-json target/msl-funnel.json --tolerance-scale 0.1 --fetch-ref --baseline-json target/msl-sim.json --report doc/msl-sim.md --json target/msl-sim.json",
]

[tasks."msl:omc"]
description = "msl:funnel の結果（target/msl-funnel.json）を omc（OpenModelica、別プロセス）と突き合わせ、報告 doc/omc-compare.md を書く（S008。omc が PATH に要る）"
run = [
  "cargo xtask omc-compare --funnel-json target/msl-funnel.json --report doc/omc-compare.md --json target/omc-compare.json",
]

[tasks."wasm:build"]
description = "release の wasm（globe-mode-wasm、wasm32-unknown-unknown）をビルドし、wasm-bindgen --target nodejs で ${CARGO_TARGET_DIR:-target}/wasm-pkg/node に、同じ .wasm から --target web で wasm-pkg/web に糊を作る（S012、S036）"
# 大きさの最適化は workspace の [profile.release] を変えず、ここで環境変数で与える（ネイティブの release に影響させない）
env = { CARGO_PROFILE_RELEASE_LTO = "fat", CARGO_PROFILE_RELEASE_CODEGEN_UNITS = "1", CARGO_PROFILE_RELEASE_OPT_LEVEL = "s", CARGO_PROFILE_RELEASE_STRIP = "true" }
run = """
set -eu
T="${CARGO_TARGET_DIR:-target}"
cargo build --release --target wasm32-unknown-unknown -p globe-mode-wasm
wasm-bindgen --target nodejs --out-dir "$T/wasm-pkg/node" "$T/wasm32-unknown-unknown/release/globe_mode_wasm.wasm"
wasm-bindgen --target web --out-dir "$T/wasm-pkg/web" "$T/wasm32-unknown-unknown/release/globe_mode_wasm.wasm"
ls -l "$T/wasm-pkg/node/globe_mode_wasm_bg.wasm" "$T/wasm-pkg/web/globe_mode_wasm_bg.wasm"
"""

[tasks."wasm:node"]
description = "release の wasm を Node で回す（S012。Decay を bdf・dopri45・auto で、data/msl があれば MSL の ChuaCircuit も。panic の文言も確かめる）"
depends = ["wasm:build"]
run = "node src/Rust/mod/globe-mode-wasm/node/smoke.mjs --msl data/msl"

[tasks."wasm:web"]
description = "wasm を Web Worker で回す（S036。Node の worker_threads と、Playwright の Chromium の module Worker で、Decay・panic・作り直しと再生を確かめる）"
depends = ["wasm:build"]
run = """
set -eu
node src/Rust/mod/globe-mode-wasm/web/worker-node.mjs
uv run python src/Rust/mod/globe-mode-wasm/web/browser.py
"""

[tasks."wasm:compare"]
description = "GlobeModeValidation.Simulation の例題を、実装のあるソルバすべてで wasm（Node）とネイティブの globe simulate の両方で回し、診断のコードと結果の CSV を突き合わせる（S012）"
depends = ["wasm:build"]
run = """
set -eu
T="${CARGO_TARGET_DIR:-target}"
node --test src/Rust/mod/globe-mode-wasm/node/csv-compare.test.mjs
cargo build --release -q -p globe-mode-cli
node src/Rust/mod/globe-mode-wasm/node/compare.mjs --globe "$T/release/globe"
"""

[tasks."c:build"]
description = "C ABI の共有ライブラリ（globe-mode-c の libglobe_mode_c.so と .a）を release でビルドする（S075）"
run = "cargo build --release -q -p globe-mode-c"

[tasks."c:zig"]
description = "Zig の例（src/Zig）で C ABI に link し、GlobeModeValidation.Simulation.Decay を check → simulate する（S075）"
depends = ["c:build"]
run = """
set -eu
T="$(realpath "${CARGO_TARGET_DIR:-target}")"
cd src/Zig
zig build run -Dlib-dir="$T/release" -- "$(realpath ../Modelica/GlobeModeValidation)" GlobeModeValidation.Simulation.Decay
"""

[tasks."c:julia"]
description = "Julia の例（src/Julia、ccall だけ）で C ABI を呼び、GlobeModeValidation.Simulation.Decay を check → simulate する（S075）"
depends = ["c:build"]
run = """
set -eu
T="$(realpath "${CARGO_TARGET_DIR:-target}")"
GLOBE_MODE_LIB="$T/release/libglobe_mode_c.so" julia --startup-file=no src/Julia/test.jl src/Modelica/GlobeModeValidation GlobeModeValidation.Simulation.Decay
"""

[tasks."elixir:test"]
description = "Elixir の束ね（src/Elixir/globe_mode、Rustler の NIF の globe-mode-nif）で GlobeModeValidation.Simulation.Decay を check → simulate する（S082）"
run = """
set -eu
# RPi（aarch64）では elixir が入らない（ADR-0019）。MISE_DISABLE_TOOLS=elixir のときは飛ばす
case ",${MISE_DISABLE_TOOLS:-}," in *,elixir,*) echo "elixir:test: MISE_DISABLE_TOOLS に elixir があるので飛ばす"; exit 0 ;; esac
cargo build --release -q -p globe-mode-nif
T="$(realpath "${CARGO_TARGET_DIR:-target}")"
cd src/Elixir/globe_mode
mix deps.get
GLOBE_MODE_NIF="$T/release/libglobe_mode_nif" mix test
"""

[tasks."gleam:test"]
description = "Gleam の束ね（src/Gleam/globe_mode、@external で globe-mode-nif を呼ぶ）で GlobeModeValidation.Simulation.Decay を check → simulate する（S087）"
run = """
set -eu
# RPi（aarch64）では erlang・elixir が入らない（ADR-0019）。MISE_DISABLE_TOOLS に erlang か elixir があるときは飛ばす
case ",${MISE_DISABLE_TOOLS:-}," in *,erlang,*|*,elixir,*) echo "gleam:test: MISE_DISABLE_TOOLS に erlang か elixir があるので飛ばす"; exit 0 ;; esac
cargo build --release -q -p globe-mode-nif
T="$(realpath "${CARGO_TARGET_DIR:-target}")"
cd src/Gleam/globe_mode
GLOBE_MODE_NIF="$T/release/libglobe_mode_nif" gleam test
"""

[tasks."leptos:build"]
description = "Leptos 版（src/Rust/apps/experimental/leptos、別の workspace）を release の wasm32 でビルドし、wasm-bindgen --target web で dist/ に糊と index.html、data/msl があれば msl/MSL.json を置く（S153、ADR-0035。trunk は使わない）"
env = { CARGO_PROFILE_RELEASE_LTO = "fat", CARGO_PROFILE_RELEASE_CODEGEN_UNITS = "1", CARGO_PROFILE_RELEASE_OPT_LEVEL = "s", CARGO_PROFILE_RELEASE_STRIP = "true" }
run = """
set -eu
M=src/Rust/apps/experimental/leptos
# 別の workspace の target はルートのものと混ぜない（CARGO_TARGET_DIR があればその下の leptos/）
export CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-target}/leptos"
cargo build --release --manifest-path "$M/Cargo.toml" --target wasm32-unknown-unknown
rm -rf "$M/dist"
mkdir -p "$M/dist/msl"
wasm-bindgen --target web --out-dir "$M/dist/pkg" "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/globe-mode-leptos.wasm"
cp "$M/index.html" "$M/main.js" "$M/style.css" "$M/dist/"
if [ -d data/msl ]; then
  node src/Svelte/scripts/pack-msl.mjs
  cp src/Svelte/public/msl/MSL.json "$M/dist/msl/"
fi
ls -l "$M/dist/pkg/globe-mode-leptos_bg.wasm"
"""

[tasks."leptos:check"]
description = "Leptos 版の検査（S153。fmt・clippy・cargo deny と、Playwright の Chromium で GM-SMOKE・検査・実行・ダークモード）"
depends = ["leptos:build"]
run = """
set -eu
M=src/Rust/apps/experimental/leptos
export CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-target}/leptos"
cargo fmt --manifest-path "$M/Cargo.toml" --check
cargo clippy --manifest-path "$M/Cargo.toml" --target wasm32-unknown-unknown -- -D warnings
cargo deny --manifest-path "$M/Cargo.toml" --config "$M/deny.toml" check
uv run python "$M/tests/test_leptos.py"
"""

[tasks."dioxus:build"]
description = "Dioxus 版（src/Rust/apps/experimental/dioxus、別の workspace）を release の wasm32 でビルドし、wasm-bindgen --target web で dist/ に糊と index.html、data/msl があれば msl/MSL.json を置く（S155、ADR-0036。dx は使わない）"
env = { CARGO_PROFILE_RELEASE_LTO = "fat", CARGO_PROFILE_RELEASE_CODEGEN_UNITS = "1", CARGO_PROFILE_RELEASE_OPT_LEVEL = "s", CARGO_PROFILE_RELEASE_STRIP = "true" }
run = """
set -eu
M=src/Rust/apps/experimental/dioxus
# 別の workspace の target はルートのものと混ぜない（CARGO_TARGET_DIR があればその下の dioxus/）
export CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-target}/dioxus"
cargo build --release --manifest-path "$M/Cargo.toml" --target wasm32-unknown-unknown
rm -rf "$M/dist"
mkdir -p "$M/dist/msl"
wasm-bindgen --target web --out-dir "$M/dist/pkg" "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/globe-mode-dioxus.wasm"
cp "$M/index.html" "$M/main.js" "$M/style.css" "$M/dist/"
if [ -d data/msl ]; then
  node src/Svelte/scripts/pack-msl.mjs
  cp src/Svelte/public/msl/MSL.json "$M/dist/msl/"
fi
ls -l "$M/dist/pkg/globe-mode-dioxus_bg.wasm"
"""

[tasks."dioxus:check"]
description = "Dioxus 版の検査（S155。fmt・clippy・cargo deny と、Playwright の Chromium で GM-SMOKE・検査・実行・ダークモード）"
depends = ["dioxus:build"]
run = """
set -eu
M=src/Rust/apps/experimental/dioxus
export CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-target}/dioxus"
cargo fmt --manifest-path "$M/Cargo.toml" --check
cargo clippy --manifest-path "$M/Cargo.toml" --target wasm32-unknown-unknown -- -D warnings
cargo deny --manifest-path "$M/Cargo.toml" --config "$M/deny.toml" check
uv run python "$M/tests/test_dioxus.py"
"""

[tasks."ui:build"]
description = "ブラウザ UI（src/Svelte）をビルドする（S041。wasm:build の出力を public/wasm/ にコピーして vite build。先に wasm:build が要る）"
run = """
set -eu
cd src/Svelte
pnpm install --frozen-lockfile
pnpm build
"""

[tasks."ui:preview"]
description = "クローン直後に GUI を確かめる（S242）。wasm:build → ui:build のあと、src/Svelte/dist を vite preview で http://localhost:4173/ に配る（Ctrl+C で止める。MSL は先に cargo xtask fetch-msl。無くても動く）"
depends = ["wasm:build", "ui:build"]
run = """
set -eu
cd src/Svelte
echo "ブラウザで http://localhost:4173/ を開く（止めるのは Ctrl+C）"
pnpm exec vite preview --host 0.0.0.0 --port 4173 --strictPort
"""

[tasks."ui:check"]
description = "ブラウザ UI の検査（S041。svelte-check と、Playwright の Chromium で Decay と特異なモデルを検査する試験。S046 から connect グラフの試験も。S048 から data/msl があれば「MSL を読む」と ChuaCircuit の試験も）"
depends = ["wasm:build"]
run = """
set -eu
cd src/Svelte
pnpm install --frozen-lockfile
pnpm check
pnpm build
cd ../..
uv run python src/Svelte/tests/test_ui.py
uv run python src/Svelte/tests/test_graph.py
"""

[tasks."docs:check"]
description = "スライド・リンクの検査と、Playwright でのブラウザ表示の検査"
run = [
  "python3 -I .claude/skills/session-docs/check_docs.py",
  "uv run python .claude/skills/session-docs/render_slides.py",
]

# python は書かない。Python 本体は uv が .python-version (3.12) から取得する。
