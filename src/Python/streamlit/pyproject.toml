[project]
name = "globe-fmt-streamlit"
version = "0.2.0"
description = "GlobeMode の整形・lint を Streamlit の画面で使う（CLI `globe` を子プロセスで呼ぶ）"
requires-python = ">=3.12"
license = "MIT OR Apache-2.0"
dependencies = [
    "streamlit>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["."]
