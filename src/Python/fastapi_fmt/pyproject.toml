[project]
name = "globe-fmt-fastapi"
version = "0.1.0"
description = "GlobeMode の整形と lint を FastAPI のウェブアプリで使う（エンジンは globe CLI）"
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
