[package]
name = "web-axum"
description = "GlobeMode: Modelica の整形と lint の Web アプリ（axum。エンジンは globe-mode-fmt）"
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# 独立した workspace（ルートの workspace に入れない。CI と cargo deny の対象を増やさない）
[workspace]

[dependencies]
axum = "0.8.9"
globe-mode-fmt = { path = "../../mod/globe-mode-fmt" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread"] }
