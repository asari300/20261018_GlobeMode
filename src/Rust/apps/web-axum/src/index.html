<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modelica 整形・lint</title>
<style>
  body { font-family: system-ui, "Hiragino Sans", "Yu Gothic", sans-serif; margin: 0 auto; max-width: 960px; padding: 16px; color: #1b1f24; background: #fff; }
  h1 { font-size: 1.4rem; margin: 0.4rem 0 1rem; }
  h2 { font-size: 1.05rem; margin: 1.4rem 0 0.4rem; }
  textarea { width: 100%; box-sizing: border-box; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; min-height: 220px; padding: 8px; border: 1px solid #8a94a0; border-radius: 4px; }
  textarea[readonly] { background: #f6f8fa; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 8px 0; }
  button { padding: 6px 14px; font-size: 14px; border: 1px solid #1f6feb; border-radius: 4px; background: #1f6feb; color: #fff; cursor: pointer; }
  button.sub { background: #fff; color: #1f6feb; }
  button:disabled { opacity: 0.45; cursor: default; }
  #error { color: #b42318; font-weight: bold; min-height: 1.2em; white-space: pre-wrap; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { border: 1px solid #d0d7de; padding: 4px 8px; text-align: left; vertical-align: top; }
  th { background: #f6f8fa; }
  td.num { white-space: nowrap; }
  @media (max-width: 600px) { body { padding: 12px; } }
</style>
</head>
<body>
<h1>Modelica 整形・lint</h1>

<h2>入力</h2>
<textarea id="source" name="source" spellcheck="false" aria-label="入力"></textarea>
<div class="row">
  <label>ファイルから読み込む（.mo）: <input type="file" id="file" accept=".mo"></label>
</div>

<h2>設定</h2>
<div class="row">
  <label>インデント
    <select id="indent">
      <option value="2" selected>2</option>
      <option value="4">4</option>
    </select>
  </label>
  <label><input type="checkbox" id="origin" checked> <code>origin = {0, 0}</code> を足す</label>
</div>
<div class="row">
  <button id="format" type="button">整形</button>
  <button id="lint" type="button">lint</button>
</div>
<div id="error" role="alert"></div>

<h2>出力</h2>
<textarea id="out" name="out" readonly aria-label="出力"></textarea>
<div class="row">
  <button id="back" class="sub" type="button" disabled>入力へ戻す</button>
</div>

<h2>lint の結果</h2>
<table>
  <thead><tr><th>rule</th><th>line</th><th>column</th><th>message</th></tr></thead>
  <tbody id="messages"></tbody>
</table>

<script>
const $ = (id) => document.getElementById(id);

function showError(text) { $('error').textContent = text || ''; }

async function post(path, body) {
  const res = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  return res.json();
}

$('file').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  $('source').value = await file.text();
  showError('');
});

$('format').addEventListener('click', async () => {
  showError('');
  try {
    const r = await post('/api/format', {
      text: $('source').value,
      indent: Number($('indent').value),
      insert_origin: $('origin').checked,
    });
    if (r.ok) {
      $('out').value = r.text;
      $('back').disabled = false;
    } else {
      $('out').value = '';
      $('back').disabled = true;
      showError(r.error);
    }
  } catch (err) {
    showError('整形に失敗: ' + err);
  }
});

$('lint').addEventListener('click', async () => {
  showError('');
  try {
    const r = await post('/api/lint', { text: $('source').value });
    const body = $('messages');
    body.replaceChildren();
    for (const m of r.messages) {
      const tr = document.createElement('tr');
      for (const [value, cls] of [[m.rule, ''], [m.line, 'num'], [m.column, 'num'], [m.message, '']]) {
        const td = document.createElement('td');
        td.textContent = String(value);
        if (cls) td.className = cls;
        tr.appendChild(td);
      }
      body.appendChild(tr);
    }
    if (r.messages.length === 0) {
      const tr = document.createElement('tr');
      const td = document.createElement('td');
      td.colSpan = 4;
      td.textContent = '指摘はない';
      tr.appendChild(td);
      body.appendChild(tr);
    }
  } catch (err) {
    showError('lint に失敗: ' + err);
  }
});

$('back').addEventListener('click', () => {
  $('source').value = $('out').value;
});
</script>
</body>
</html>
