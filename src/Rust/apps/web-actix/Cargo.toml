[package]
name = "web-actix"
description = "GlobeMode: Modelica の整形と lint の Web アプリ（actix-web。エンジンは globe-mode-fmt）"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# 独立した workspace（ルートの workspace に入れない。CI と cargo deny の対象を増やさない）
[workspace]

[dependencies]
actix-web = { version = "4", default-features = false, features = ["macros"] }
globe-mode-fmt = { path = "../../mod/globe-mode-fmt" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
