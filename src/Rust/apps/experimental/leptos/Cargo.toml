# GlobeMode の Leptos 版（S153、ADR-0035）。Leptos の CSR（wasm32）で、UI と計算（facade `globe-mode`）が 1 つの wasm に入る。
# ルートの workspace には入れない（自分の [workspace] と Cargo.lock を持つ。desktop と同じ）。ビルドは mise run leptos:build。
[package]
name = "globe-mode-leptos"
version = "0.2.0"
description = "GlobeMode experimental UI: Leptos (CSR) with the core linked into the same wasm"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/asari300/20261018_GlobeMode"
publish = false

[workspace]

[dependencies]
leptos = { version = "0.8.23", features = ["csr"] }
globe-mode = { path = "../../../mod/globe-mode", version = "0.2.0" }
serde_json = "1"
# ルートの workspace と同じ版（CLI の wasm-bindgen と揃える。mise.toml）
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Performance", "Response", "Location", "Document", "Element"] }

# ルートの [patch.crates-io] と同じ。[patch] は workspace のルートでしか効かないので、こちらにも要る（ADR-0013）
[patch.crates-io]
diffsol = { git = "https://github.com/CogniPilot/rumoca", rev = "276e82bd0fd48960ac201e782918d28bf19cf7ce" }
