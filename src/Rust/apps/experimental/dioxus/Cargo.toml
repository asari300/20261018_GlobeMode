# GlobeMode の Dioxus 版（S155、ADR-0036）。Dioxus の web（CSR、wasm32）で、UI と計算（facade `globe-mode`）が 1 つの wasm に入る。
# ルートの workspace には入れない（自分の [workspace] と Cargo.lock を持つ。leptos・desktop と同じ）。ビルドは mise run dioxus:build（dx は使わない）。
[package]
name = "globe-mode-dioxus"
version = "0.2.0"
description = "GlobeMode experimental UI: Dioxus (web, CSR) with the core linked into the same wasm"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/asari300/20261018_GlobeMode"
publish = false

[workspace]

[dependencies]
# default-features を切る（devtools・logger・asset・document などを引き込まない）。minimal = macro・html・signals・hooks・launch
dioxus = { version = "0.7.10", default-features = false, features = ["minimal", "web"] }
globe-mode = { path = "../../../mod/globe-mode", version = "0.2.0" }
serde_json = "1"
# ルートの workspace と同じ版（CLI の wasm-bindgen と揃える。mise.toml）
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Performance", "Response", "Location", "Document", "Element", "console"] }

# ルートの [patch.crates-io] と同じ。[patch] は workspace のルートでしか効かないので、こちらにも要る（ADR-0013）
[patch.crates-io]
diffsol = { git = "https://github.com/CogniPilot/rumoca", rev = "276e82bd0fd48960ac201e782918d28bf19cf7ce" }
