[package]
name = "globe-mode-protocol"
description = "GlobeMode: the serde request / response types shared by the CLI, wasm, LSP and language bindings"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
globe-mode-core = { workspace = true }
globe-mode-ir = { workspace = true }
globe-mode-analysis = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
# check_response_keys_follow_the_cli_json は to_value の鍵の順（構造体の宣言順）を見る。単体（-p）の試験でも順が保たれるよう明示する（S357）
serde_json = { workspace = true, features = ["preserve_order"] }

[lints]
workspace = true
