[package]
name = "globe-mode-fmt"
description = "GlobeMode: Modelica formatter and linter (no dependencies, usable standalone)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# S130: 設定ファイル globe-mode.toml を読む（`LintOptions::from_toml`・`find`）。CLI と LSP だけが立て、既定と wasm は依存 0 のまま
config = ["dep:toml"]

[dependencies]
# Cargo.lock に既にある版（rumoca-core が使う）。新しい crate は入らない
toml = { version = "0.8", optional = true }

[lints]
workspace = true
