[package]
name = "globe-mode"
description = "GlobeMode: the public Rust API (facade over the query DB, the checks and the execution backend)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# S032・S034: CVODE と IDA（SUNDIALS）。cmake と C コンパイラが要る
sundials = ["globe-mode-exec/sundials"]
# S118: FMU の書き出し（export_fmu）。ファイルを書くので wasm は引かない（CLI・C ABI・NIF・Python が有効にする）
fmu = ["dep:globe-mode-fmi", "globe-mode-fmi/export", "dep:serde"]

[dependencies]
globe-mode-core = { workspace = true }
globe-mode-ir = { workspace = true }
globe-mode-frontend = { workspace = true }
globe-mode-graph = { workspace = true }
globe-mode-db = { workspace = true }
globe-mode-exec = { workspace = true }
globe-mode-sim = { workspace = true }
globe-mode-protocol = { workspace = true }
# S111: format / lint（各言語の束ねが facade だけで呼べるように）
globe-mode-fmt = { workspace = true }
serde_json = { workspace = true }
globe-mode-fmi = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[lints]
workspace = true
