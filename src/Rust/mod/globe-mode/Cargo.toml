[package]
name = "globe-mode"
description = "GlobeMode: the public Rust API (facade over the query DB, the checks and the execution backend)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# S032・S034: CVODE と IDA（SUNDIALS）。cmake と C コンパイラが要る
sundials = ["globe-mode-exec/sundials"]
# S118: FMU の書き出し（export_fmu）。S144: zip のバイト列で返す export_fmu_bytes は wasm32 でも通る（lsp が有効にし、wasm はそれを使う）
fmu = ["dep:globe-mode-fmi", "globe-mode-fmi/export"]
# S229: FMU の読み込みと実行（import_fmu_info・run_fmu。ADR-0026 の (p)）。共有ライブラリを読むので wasm32・Android では付けない
fmu-import = ["dep:globe-mode-fmi-import"]
# S239: P5b の FMU の書き出し（runtime = p5b。自前の実行時の共有ライブラリを入れる）。cargo か runtime_lib を使うので wasm32 では付けない
fmu-p5b = ["fmu", "dep:globe-mode-fmu"]

[dependencies]
globe-mode-core = { workspace = true }
globe-mode-ir = { workspace = true }
globe-mode-frontend = { workspace = true }
globe-mode-graph = { workspace = true }
globe-mode-db = { workspace = true }
globe-mode-exec = { workspace = true }
globe-mode-sim = { workspace = true }
globe-mode-protocol = { workspace = true }
# S111: format / lint（各言語の束ねが facade だけで呼べるように）
globe-mode-fmt = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
globe-mode-fmi = { workspace = true, optional = true }
globe-mode-fmi-import = { workspace = true, optional = true }
globe-mode-fmu = { workspace = true, optional = true }

[lints]
workspace = true
