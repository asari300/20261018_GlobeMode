[package]
name = "globe-mode-cli"
description = "GlobeMode command line interface (`globe`)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "globe"
path = "src/main.rs"

[features]
# S032・S034: CVODE と IDA（SUNDIALS）を使う。cmake と C コンパイラが要る
sundials = ["globe-mode/sundials"]

[dependencies]
# S035: facade（と protocol の型）経由。db・exec・sim は facade の再公開を使う
globe-mode = { workspace = true }
globe-mode-core = { workspace = true }
globe-mode-lsp = { workspace = true }
globe-mode-fmt = { workspace = true }
# S094: `globe fmu export`（FMI 2.0 のソースの FMU。ADR-0031）
globe-mode-fmi = { workspace = true, features = ["export"] }
globe-mode-ir = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
# S060: fmt / lint のディレクトリの走査で .gitignore を守る（ruff と同じ crate。MIT OR Unlicense）
ignore = "0.4"

[lints]
workspace = true
