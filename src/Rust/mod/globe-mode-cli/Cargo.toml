[package]
name = "globe-mode-cli"
description = "GlobeMode command line interface (`globe`)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "globe"
path = "src/main.rs"

[features]
# S032・S034: CVODE と IDA（SUNDIALS）を使う。cmake と C コンパイラが要る
sundials = ["globe-mode/sundials"]

[dependencies]
# S035: facade（と protocol の型）経由。db・exec・sim は facade の再公開を使う
# S118: fmu で `globe fmu export` を facade の export_fmu から
globe-mode = { workspace = true, features = ["fmu", "fmu-import", "fmu-p5b"] }
globe-mode-core = { workspace = true }
# S204: `globe fmu info` / `run`（FMU の読み込み。ネイティブのみ。ADR-0026）
globe-mode-fmi = { workspace = true }
globe-mode-fmi-import = { workspace = true }
globe-mode-frontend = { workspace = true }
globe-mode-lsp = { workspace = true, features = ["fmu-import", "fmu-p5b"] }
globe-mode-fmt = { workspace = true, features = ["config"] }
globe-mode-ir = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
# S060: fmt / lint のディレクトリの走査で .gitignore を守る（ruff と同じ crate。MIT OR Unlicense）
ignore = "0.4"

[lints]
workspace = true

[dev-dependencies]
# S210: 落ちる FMU（zip）を試験の中で組み立てる。fmi-import の試験と同じ 9 系
zip = { version = "9", default-features = false, features = ["deflate"] }
