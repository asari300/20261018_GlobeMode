[package]
name = "globe-mode-cli"
description = "GlobeMode command line interface (`globe`)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "globe"
path = "src/main.rs"

[features]
# S032・S034: CVODE と IDA（SUNDIALS）を使う。cmake と C コンパイラが要る
sundials = ["globe-mode/sundials"]

[dependencies]
# S035: facade（と protocol の型）経由。db・exec・sim は facade の再公開を使う
globe-mode = { workspace = true }
globe-mode-core = { workspace = true }
globe-mode-ir = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
