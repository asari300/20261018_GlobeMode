[package]
name = "globe-mode-exec"
description = "GlobeMode: the execution backend (Rumoca's simulation stack behind a neutral API)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["rumoca-exec"]
# Phase A の実行系。Rumoca を import してよいのはこの feature の中だけ（ADR-0002、ADR-0013）
rumoca-exec = [
  "dep:rumoca-sim",
  "dep:rumoca-solver",
  "dep:rumoca-ir-dae",
  "dep:rumoca-phase-solve",
  "dep:rumoca-solver-diffsol",
  "dep:rumoca-solver-rk45",
  "dep:diffsol",
  "dep:self_cell",
  "dep:getrandom",
]
# S032: CVODE（SUNDIALS。cmake と C コンパイラが要る。wasm では使えない）。登録表の `cvode` も有効になる
sundials = ["rumoca-exec", "dep:sundials-sys", "globe-mode-sim/sundials"]

[dependencies]
globe-mode-core = { workspace = true }
globe-mode-ir = { workspace = true }
# CompiledModel は frontend の feature `rumoca` にある（exec の feature を切っても型は要る）
globe-mode-frontend = { workspace = true }
globe-mode-sim = { workspace = true }
rumoca-sim = { workspace = true, optional = true }
rumoca-solver = { workspace = true, optional = true }
rumoca-ir-dae = { workspace = true, optional = true }
# S012: lowering と実行を分けて呼ぶ道（src/rumoca/session.rs）と、数値積分のプラグイン（src/rumoca/plugins.rs）
rumoca-phase-solve = { workspace = true, optional = true }
rumoca-solver-diffsol = { workspace = true, optional = true }
rumoca-solver-rk45 = { workspace = true, optional = true }
diffsol = { workspace = true, optional = true }
self_cell = { workspace = true, optional = true }
sundials-sys = { workspace = true, optional = true }

# S012: wasm32 では diffsol の faer → rand → getrandom 0.3 に、JS の乱数の backend が要る
# （.cargo/config.toml の cfg `getrandom_backend="wasm_js"` と対で使う）
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"], optional = true }

# workspace の lints（unsafe_code = "forbid"）と同じだが、unsafe だけ "deny" にする。forbid は `allow` で外せないため。
# S032: C の API（SUNDIALS）を呼ぶ plugins/cvode.rs だけが `#![allow(unsafe_code)]` で許す。ほかの unsafe は deny のまま
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
dbg_macro = "warn"
