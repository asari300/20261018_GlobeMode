[package]
name = "globe-mode-fmu"
description = "GlobeMode: own FMI 2.0 Model Exchange runtime (P5b: compiles resources/<model>.mo through globe-mode-exec)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# modelDescription.xml の modelIdentifier と同じ名前（FMU の binaries/linux64/globe_mode_fmu.so）
name = "globe_mode_fmu"
# rlib はテスト（tests/fmpy.rs）から関数を直接呼ぶため
crate-type = ["cdylib", "rlib"]

# S099: モデルを resources の .mo から compile し、exec の ModelInstance で微分を求める（ADR-0032 の追記）
[dependencies]
globe-mode-frontend = { workspace = true }
globe-mode-exec = { workspace = true }
# S117: modelDescription.xml の型と書く側（既定の feature だけ。export は引き込まない）
globe-mode-fmi = { workspace = true }

# FFI の境界なので workspace の unsafe_code = "forbid" を外す（残りは workspace と同じ。globe-mode-c と同じ）
[lints.rust]
missing_debug_implementations = "warn"

[lints.clippy]
dbg_macro = "warn"
