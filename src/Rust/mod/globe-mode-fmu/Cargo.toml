[package]
name = "globe-mode-fmu"
description = "GlobeMode: own FMI 2.0 Model Exchange runtime (P5b, S095: Decay fixed in the crate)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# modelDescription.xml の modelIdentifier と同じ名前（FMU の binaries/linux64/globe_mode_fmu.so）
name = "globe_mode_fmu"
# rlib はテスト（tests/fmpy.rs）から関数を直接呼ぶため
crate-type = ["cdylib", "rlib"]

# S095: 依存は無い（ADR-0032。モデルは src/lib.rs に固定）

# FFI の境界なので workspace の unsafe_code = "forbid" を外す（残りは workspace と同じ。globe-mode-c と同じ）
[lints.rust]
missing_debug_implementations = "warn"

[lints.clippy]
dbg_macro = "warn"
