[package]
name = "globe-mode-c"
description = "GlobeMode: C ABI (globe_mode.h) for Zig, Julia and other languages"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "globe_mode_c"
# rlib はテスト（tests/header.rs）から関数を呼ぶため
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# S075: facade だけに依存する（globe-mode-py・globe-mode-wasm と同じ）
globe-mode = { workspace = true, features = ["fmu"] }
serde = { workspace = true }
serde_json = { workspace = true }

# FFI の境界なので workspace の unsafe_code = "forbid" を外す（残りは workspace と同じ）
[lints.rust]
missing_debug_implementations = "warn"

[lints.clippy]
dbg_macro = "warn"
