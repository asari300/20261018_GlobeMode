[package]
name = "globe-mode-wasm"
description = "GlobeMode: wasm-bindgen bindings (check, compile and simulate in the browser / Node)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# S239: doctest を回さない。feature fmu-p5b がワークスペース全体で有効になり、cdylib 兼 rlib の globe-mode-fmu（hash 無しの名前の rlib）に
# 依存する。その rlib は globe-mode-fmu の試験が入れ子で回す cargo build に上書きされ、rustdoc が E0460 / E0463 で落ちる（globe-mode-nif と同じ扱い）。
doctest = false
crate-type = ["cdylib", "rlib"]

[dependencies]
# S035: facade と protocol だけに依存する。S138: 定義ジャンプの解決（`globe_mode_lsp::definition`）だけ lsp から借りる
globe-mode = { workspace = true, features = ["fmu"] } # S144: export_fmu_bytes
globe-mode-fmt = { workspace = true }
globe-mode-lsp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = { workspace = true }

[lints]
workspace = true
