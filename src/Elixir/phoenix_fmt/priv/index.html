<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modelica 整形・lint（GlobeMode）</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #fff; color: #111; }
    h1 { font-size: 1.3rem; margin: 0 0 12px; }
    h2 { font-size: 1.05rem; margin: 16px 0 6px; }
    textarea { box-sizing: border-box; width: 100%; min-height: 180px; font-family: ui-monospace, monospace; font-size: 13px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; }
    button { padding: 6px 14px; font-size: 14px; }
    .error { color: #b00020; font-weight: bold; white-space: pre-wrap; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    th, td { border: 1px solid #ccc; padding: 4px 6px; text-align: left; vertical-align: top; }
    @media (prefers-color-scheme: dark) {
      body { background: #111; color: #eee; }
      th, td { border-color: #444; }
    }
  </style>
</head>
<body>
  <h1>Modelica 整形・lint（GlobeMode）</h1>

  <h2>入力</h2>
  <div class="row">
    <input type="file" id="file" accept=".mo">
  </div>
  <textarea name="source" id="source" spellcheck="false" placeholder="Modelica のコードを貼り付けるか、.mo ファイルを選ぶ"></textarea>

  <div class="row">
    <label>インデント
      <select id="indent">
        <option value="2" selected>2</option>
        <option value="4">4</option>
      </select>
    </label>
    <label><input type="checkbox" id="origin" checked> <code>origin = {0, 0}</code> を足す</label>
  </div>
  <div class="row">
    <button type="button" id="fmt">整形</button>
    <button type="button" id="lint">lint</button>
  </div>

  <div id="error" class="error" hidden></div>

  <h2>整形結果</h2>
  <textarea id="out" readonly spellcheck="false"></textarea>
  <div class="row">
    <button type="button" id="back">入力へ戻す</button>
  </div>

  <h2>lint</h2>
  <div id="lint-result"></div>

  <script>
    const $ = (id) => document.getElementById(id);

    function showError(msg) {
      $('error').textContent = msg || '';
      $('error').hidden = !msg;
    }

    async function post(path, body) {
      const res = await fetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      return res.json();
    }

    $('file').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (file) $('source').value = await file.text();
    });

    $('fmt').addEventListener('click', async () => {
      showError('');
      try {
        const data = await post('/api/format', {
          text: $('source').value,
          indent: Number($('indent').value),
          insert_origin: $('origin').checked,
        });
        if (data.ok) {
          $('out').value = data.text;
        } else {
          $('out').value = '';
          showError(data.error || '整形に失敗しました');
        }
      } catch (err) {
        showError(String(err));
      }
    });

    $('lint').addEventListener('click', async () => {
      showError('');
      try {
        const data = await post('/api/lint', { text: $('source').value });
        if (data.error) {
          showError(data.error);
          return;
        }
        const table = document.createElement('table');
        table.innerHTML = '<thead><tr><th>rule</th><th>line</th><th>column</th><th>message</th></tr></thead>';
        const tbody = document.createElement('tbody');
        for (const m of data.messages) {
          const tr = document.createElement('tr');
          for (const v of [m.rule, m.line, m.column, m.message]) {
            const td = document.createElement('td');
            td.textContent = String(v);
            tr.appendChild(td);
          }
          tbody.appendChild(tr);
        }
        table.appendChild(tbody);
        $('lint-result').replaceChildren(
          data.messages.length ? table : document.createTextNode('指摘はありません')
        );
      } catch (err) {
        showError(String(err));
      }
    });

    $('back').addEventListener('click', () => {
      $('source').value = $('out').value;
    });
  </script>
</body>
</html>
