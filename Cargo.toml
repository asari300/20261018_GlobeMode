[workspace]
resolver = "3"
members = ["src/Rust/mod/globe-mode-*", "src/Rust/xtask"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/asari300/20261018_GlobeMode"
rust-version = "1.99"
# Rumoca を git 依存で使う間は crates.io に公開できない（ADR-0002）
publish = false

[workspace.dependencies]
globe-mode-core = { path = "src/Rust/mod/globe-mode-core", version = "0.0.1" }
globe-mode-ir = { path = "src/Rust/mod/globe-mode-ir", version = "0.0.1" }
globe-mode-frontend = { path = "src/Rust/mod/globe-mode-frontend", version = "0.0.1" }
globe-mode-graph = { path = "src/Rust/mod/globe-mode-graph", version = "0.0.1" }
globe-mode-db = { path = "src/Rust/mod/globe-mode-db", version = "0.0.1" }
globe-mode-analysis = { path = "src/Rust/mod/globe-mode-analysis", version = "0.0.1" }
globe-mode-exec = { path = "src/Rust/mod/globe-mode-exec", version = "0.0.1" }
globe-mode-sim = { path = "src/Rust/mod/globe-mode-sim", version = "0.0.1" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }
salsa = "0.28.5"

# Rumoca はアダプタ（globe-mode-frontend / globe-mode-exec）からだけ使う。umbrella crate `rumoca` は使わない。
# rev は v0.10.2（2026-10-04）。更新は MSL のファネルの差分を記録してから行う（doc/adr/0002-rumoca-adapter.md）。
rumoca-compile = { git = "https://github.com/CogniPilot/rumoca", rev = "276e82bd0fd48960ac201e782918d28bf19cf7ce", default-features = false }
# S005: DAE の incidence（方程式 × 未知数）を自前で作るために、DAE の IR と式の射影も同じ rev で使う（rumoca-compile の推移的依存。新しい外部依存は増えない）
rumoca-ir-dae = { git = "https://github.com/CogniPilot/rumoca", rev = "276e82bd0fd48960ac201e782918d28bf19cf7ce", default-features = false }
rumoca-eval-dae = { git = "https://github.com/CogniPilot/rumoca", rev = "276e82bd0fd48960ac201e782918d28bf19cf7ce", default-features = false }
rumoca-core = { git = "https://github.com/CogniPilot/rumoca", rev = "276e82bd0fd48960ac201e782918d28bf19cf7ce", default-features = false }
# S011: 実行系（globe-mode-exec だけ）。umbrella crate の既定の feature（zenoh・gamepad・UDP・web viewer）は使わず、
# diffsol の BDF と Rumoca の RK45 だけを有効にする（ADR-0013）。wasm 以外では Cranelift の JIT も入る
rumoca-sim = { git = "https://github.com/CogniPilot/rumoca", rev = "276e82bd0fd48960ac201e782918d28bf19cf7ce", default-features = false, features = ["solver-diffsol", "solver-rk45"] }
# S011: 実行の失敗の型（MeSessionError など）を名前で振り分けるため。rumoca-sim の推移的依存で、新しい外部依存は増えない
rumoca-solver = { git = "https://github.com/CogniPilot/rumoca", rev = "276e82bd0fd48960ac201e782918d28bf19cf7ce", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"

# S011: Rumoca は自分のワークスペースで crates.io の diffsol 0.13.2 に BDF の数値の修正を当てている
# （vendor/diffsol/RUMOCA_PATCH.md）。[patch] はワークスペースのルートでしか効かないので、git 依存の
# GlobeMode には修正前の版が入る。Rumoca の CLI と同じ数値にするため、同じ rev の vendor/diffsol を使う（ADR-0013）
[patch.crates-io]
diffsol = { git = "https://github.com/CogniPilot/rumoca", rev = "276e82bd0fd48960ac201e782918d28bf19cf7ce" }
