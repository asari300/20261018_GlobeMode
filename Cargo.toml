[workspace]
resolver = "3"
members = ["src/Rust/mod/globe-mode", "src/Rust/mod/globe-mode-*", "src/Rust/xtask"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/asari300/20261018_GlobeMode"
homepage = "https://github.com/asari300/20261018_GlobeMode"
description = "GlobeMode: an open-source Modelica IDE written in Rust"
readme = "README.md"
keywords = ["modelica", "simulation", "dae", "ide", "language-server"]
categories = ["science", "development-tools", "simulation"]
rust-version = "1.99"
# Rumoca を git 依存で使う間は crates.io に公開できない（ADR-0002）
publish = false

[workspace.dependencies]
globe-mode-core = { path = "src/Rust/mod/globe-mode-core", version = "0.0.1" }
globe-mode-ir = { path = "src/Rust/mod/globe-mode-ir", version = "0.0.1" }
globe-mode-frontend = { path = "src/Rust/mod/globe-mode-frontend", version = "0.0.1" }
globe-mode-graph = { path = "src/Rust/mod/globe-mode-graph", version = "0.0.1" }
globe-mode-db = { path = "src/Rust/mod/globe-mode-db", version = "0.0.1" }
globe-mode-analysis = { path = "src/Rust/mod/globe-mode-analysis", version = "0.0.1" }
globe-mode-exec = { path = "src/Rust/mod/globe-mode-exec", version = "0.0.1" }
globe-mode-sim = { path = "src/Rust/mod/globe-mode-sim", version = "0.0.1" }
globe-mode-protocol = { path = "src/Rust/mod/globe-mode-protocol", version = "0.0.1" }
globe-mode = { path = "src/Rust/mod/globe-mode", version = "0.0.1" }
globe-mode-lsp = { path = "src/Rust/mod/globe-mode-lsp", version = "0.0.1" }
globe-mode-py = { path = "src/Rust/mod/globe-mode-py", version = "0.0.1" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# S038: LSP の型だけ（MIT）。JSON-RPC の枠と振り分けは globe-mode-lsp が自前で持つ（tower-lsp・lsp-server は使わない）
lsp-types = "0.97"
# S039: Python の束ね（globe-mode-py だけ）。abi3-py312 は pyproject.toml の [tool.maturin] で立てる（Python 3.12 以上の 1 つの wheel）
pyo3 = "0.30"
clap = { version = "4.5", features = ["derive"] }
salsa = "0.28.5"
# S012: wasm の束ね（globe-mode-wasm だけ）。CLI の wasm-bindgen（mise.toml）と同じ版でないと糊が作れないので、
# `=` で固定する。上げるときは mise.toml の github:wasm-bindgen/wasm-bindgen も同じ版にする
wasm-bindgen = "=0.2.129"

# Rumoca はアダプタ（globe-mode-frontend / globe-mode-exec）からだけ使う。umbrella crate `rumoca` は使わない。
# rev は v0.10.2（2026-10-04）。更新は MSL のファネルの差分を記録してから行う（doc/adr/0002-rumoca-adapter.md）。
rumoca-compile = { git = "https://github.com/CogniPilot/rumoca", rev = "276e82bd0fd48960ac201e782918d28bf19cf7ce", default-features = false }
# S005: DAE の incidence（方程式 × 未知数）を自前で作るために、DAE の IR と式の射影も同じ rev で使う（rumoca-compile の推移的依存。新しい外部依存は増えない）
rumoca-ir-dae = { git = "https://github.com/CogniPilot/rumoca", rev = "276e82bd0fd48960ac201e782918d28bf19cf7ce", default-features = false }
rumoca-eval-dae = { git = "https://github.com/CogniPilot/rumoca", rev = "276e82bd0fd48960ac201e782918d28bf19cf7ce", default-features = false }
rumoca-core = { git = "https://github.com/CogniPilot/rumoca", rev = "276e82bd0fd48960ac201e782918d28bf19cf7ce", default-features = false }
# S011: 実行系（globe-mode-exec だけ）。umbrella crate の既定の feature（zenoh・gamepad・UDP・web viewer）は使わず、
# diffsol の BDF と Rumoca の RK45 だけを有効にする（ADR-0013）。wasm 以外では Cranelift の JIT も入る
rumoca-sim = { git = "https://github.com/CogniPilot/rumoca", rev = "276e82bd0fd48960ac201e782918d28bf19cf7ce", default-features = false, features = ["solver-diffsol", "solver-rk45"] }
# S012: lowering と実行を分けて呼ぶ道（globe-mode-exec だけ。wasm32 と自前の積分器）。Solve IR を FMI の部品に
# する `fmi::finish_fmi_component`。rumoca-sim の推移的依存で、新しい外部依存は増えない
rumoca-phase-solve = { git = "https://github.com/CogniPilot/rumoca", rev = "276e82bd0fd48960ac201e782918d28bf19cf7ce", default-features = false }
# S011: 実行の失敗の型（MeSessionError など）を名前で振り分けるため。rumoca-sim の推移的依存で、新しい外部依存は増えない
rumoca-solver = { git = "https://github.com/CogniPilot/rumoca", rev = "276e82bd0fd48960ac201e782918d28bf19cf7ce", default-features = false }
# S012: Rumoca の数値積分のプラグイン（FMI ME の host に差す BDF と RK45）。wasm32 の道と自前の積分器の道で使う
# （globe-mode-exec だけ）。rumoca-sim の推移的依存で、新しい外部依存は増えない
rumoca-solver-diffsol = { git = "https://github.com/CogniPilot/rumoca", rev = "276e82bd0fd48960ac201e782918d28bf19cf7ce" }
rumoca-solver-rk45 = { git = "https://github.com/CogniPilot/rumoca", rev = "276e82bd0fd48960ac201e782918d28bf19cf7ce" }
# S012: 自前の積分器（esdirk34・trbdf2・tsit45）。下の [patch] で Rumoca が修正を当てた 0.13.2 になる。
# self_cell は問題とソルバの自己参照に使う（rumoca-solver-diffsol と同じ）。どちらも Cargo.lock に既にある
diffsol = "0.13"
self_cell = "1.2.2"
# S032・S034: CVODE と IDA（globe-mode-exec の feature `sundials` だけ。wasm では使わない）。SUNDIALS を同梱のソースから cmake で
# ビルドして静的にリンクする。既定の feature（arkode・ida・kinsol）は切って CVODE・IDA だけにする。klu（LGPL）・openmp・pthreads は使わない
sundials-sys = { version = "0.6.2", default-features = false, features = ["cvode", "ida", "build_libraries", "static_libraries"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"

# S011: Rumoca は自分のワークスペースで crates.io の diffsol 0.13.2 に BDF の数値の修正を当てている
# （vendor/diffsol/RUMOCA_PATCH.md）。[patch] はワークスペースのルートでしか効かないので、git 依存の
# GlobeMode には修正前の版が入る。Rumoca の CLI と同じ数値にするため、同じ rev の vendor/diffsol を使う（ADR-0013）
[patch.crates-io]
diffsol = { git = "https://github.com/CogniPilot/rumoca", rev = "276e82bd0fd48960ac201e782918d28bf19cf7ce" }
